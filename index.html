function lerLogo(file) {
  return new Promise((res, rej) => {
    if (file.size > 3 * 1024 * 1024) return rej(new D.Erro('A imagem passa de 3 MB. Use uma menor.'));
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const s = Math.max(256 / img.width, 256 / img.height); x.drawImage(img, (256 - img.width * s) / 2, (256 - img.height * s) / 2, img.width * s, img.height * s); res(c.toDataURL('image/png')); }; img.onerror = () => rej(new D.Erro('Não consegui ler esta imagem.')); img.src = fr.result; };
    fr.onerror = () => rej(new D.Erro('Não consegui ler o arquivo.'));
    fr.readAsDataURL(file);
  });
}

const gerarCodigo = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r = new Uint32Array(6); crypto.getRandomValues(r); return [...r].map(x => a[x % a.length]).join(''); };

F.juntar = async f => {
  if (!pode('restaurar')) throw new D.Erro('Apenas a proprietária pode importar dados.');
  const arq = f.querySelector('#arqj').files[0]; if (!arq) throw new D.Erro('Escolha o arquivo de backup (.json).');
  let b; try { b = JSON.parse(await arq.text()); } catch (e) { throw new D.Erro('Arquivo inválido: não é um JSON.'); }
  if (b.app !== 'acai-da-mae-gestao' || !Array.isArray(b.eventos)) throw new D.Erro('Este arquivo não é um backup deste sistema.');
  const existentes = new Set(S.st.eventos.map(e => e.id));
  const novos = b.eventos.filter(e => e && e.id && !existentes.has(e.id));
  const maisNovo = (a, x) => !a || String(x.atualizadoEm || '') > String(a.atualizadoEm || '');
  let cad = 0;
  for (const k of Object.keys(b.config || {})) if (b.config[k] && maisNovo(S.cfg[k], b.config[k])) { await S.db.doc('config/' + k).set(b.config[k]); cad++; }
  for (const col of ['produtos', 'insumos', 'fornecedores']) for (const [id, d] of Object.entries(b[col] || {})) if (maisNovo(S[col][id], d)) { const x = Object.assign({}, d); delete x.id; await S.db.doc(col + '/' + id).set(x); cad++; }
  let lote = [], n = 0;
  const grava = async () => { if (!lote.length) return; await S.db.doc('diarios/' + S.uid + '/sessoes/importacao-' + U.sid() + '-' + (n++)).set({ uid: S.uid, importadoEm: U.agora(), origem: b.geradoEm, eventos: lote }); lote = []; };
  for (const e of novos) { lote.push(e); if (JSON.stringify(lote).length > 140000) await grava(); }
  await grava();
  Store.gravar({ tipo: 'auditoria', entidade: 'sistema', nome: 'Importação de backup', acao: 'importação', diferencas: [{ campo: 'arquivo', antes: '', depois: arq.name + ' · ' + novos.length + ' operações novas · ' + cad + ' cadastros atualizados' }] });
  f.reset();
  Toast(`Importado: ${novos.length} operação(ões) nova(s) e ${cad} cadastro(s) atualizado(s).`, 'ok');
};
F.restaurar = async f => {
  if (!pode('restaurar')) throw new D.Erro('Apenas a proprietária pode restaurar.');
  if (S.st.eventos.length) throw new D.Erro('Já existem operações registradas: restauração bloqueada.');
  const arq = f.querySelector('#arq').files[0]; if (!arq) throw new D.Erro('Escolha o arquivo de backup (.json).');
  let b; try { b = JSON.parse(await arq.text()); } catch (e) { throw new D.Erro('Arquivo inválido: não é um JSON.'); }
  if (b.app !== 'acai-da-mae-gestao' || !Array.isArray(b.eventos)) throw new D.Erro('Este arquivo não é um backup deste sistema.');
  const ok = await Confirmar({ titulo: 'Restaurar backup', texto: `Serão gravados ${Object.keys(b.produtos || {}).length} produtos, ${Object.keys(b.insumos || {}).length} insumos, ${b.eventos.length} operações e as configurações de ${h(U.dataHora(b.geradoEm))}. Cadastros com o mesmo código serão substituídos.`, botao: 'Restaurar' });
  if (!ok) return;
  for (const k of Object.keys(b.config || {})) if (b.config[k]) await S.db.doc('config/' + k).set(b.config[k]);
  for (const col of ['produtos', 'insumos', 'fornecedores']) for (const [id, d] of Object.entries(b[col] || {})) { const x = Object.assign({}, d); delete x.id; await S.db.doc(col + '/' + id).set(x); }
  let lote = [], n = 0;
  const grava = async () => { if (!lote.length) return; await S.db.doc('diarios/' + S.uid + '/sessoes/restauracao-' + U.sid() + '-' + (n++)).set({ uid: S.uid, restauradoEm: U.agora(), eventos: lote }); lote = []; };
  for (const e of b.eventos) { lote.push(e); if (JSON.stringify(lote).length > 140000) await grava(); }

  Toast('Backup restaurado.', 'ok');
};
