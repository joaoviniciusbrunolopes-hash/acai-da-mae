}

/* ---------------- Vendas: histórico ---------------- */
const StatusVenda = v => v.status === 'cancelada' ? Bdg('r', 'Cancelada') : v.numero == null ? Bdg('o', 'Aguardando envio') : Bdg('g', 'Concluída');
const FormaBdg = f => Bdg(f === 'dinheiro' ? 'g' : f === 'pix' ? 'p' : 'o', D.FORMAS[f] || f);

V.vendas = () => {
  if (!pode('vendas_todas')) UI.per.vendas = { tipo: 'hoje' };
  const p = per('vendas');
  const r = D.resumoVendas(S.st, p);
  const q = UI.busca.trim().toLowerCase().replace('#', '');
  let lista = [...S.st.vendas.values()].filter(v => U.dentro(v.dia, p));
  if (UI.filtroVenda === 'concluidas') lista = lista.filter(v => v.status === 'concluida');
  if (UI.filtroVenda === 'canceladas') lista = lista.filter(v => v.status === 'cancelada');
  if (q) lista = lista.filter(v => (v.numero != null && (String(v.numero).padStart(4, '0').includes(q) || String(v.numero) === q.replace(/^0+/, ''))) || v.itens.some(i => (i.nome + ' ' + (i.comboNome || '')).toLowerCase().includes(q)));
  lista.sort((a, b) => a.em < b.em ? 1 : -1);
  const mostrar = lista.slice(0, 300);
  return `
  ${pode('vendas_todas') ? ChipsPer('vendas') : '<small>Vendas de hoje</small>'}
  <div class="grid g4">
    <div class="card" style="padding:12px">${Kpi({ label: 'Faturamento', valor: brl(r.fat), info: 'faturamento' })}</div>
    <div class="card" style="padding:12px">${Kpi({ label: 'Vendas', valor: r.n })}</div>
    <div class="card" style="padding:12px">${Kpi({ label: 'Ticket médio', valor: brl(r.ticket), info: 'ticket' })}</div>
    <div class="card" style="padding:12px">${Kpi({ label: 'Canceladas', valor: r.canc, sub: r.canc ? brl(r.cancV) : '' })}</div>
  </div>
  <button class="btn lar w" data-a="novaVenda" style="padding:15px">${I('mais1')} Nova venda</button>
  <div class="card">
    <div class="cab"><h2>Histórico</h2>${Chips([['todas', 'Todas'], ['concluidas', 'Concluídas'], ['canceladas', 'Canceladas']], UI.filtroVenda, 'filtroVenda')}</div>
    <div class="campo" style="margin-bottom:6px"><label for="busca-venda" class="sr">Buscar</label><input class="in" id="busca-venda" data-i="busca" value="${h(UI.busca)}" placeholder="Buscar por nº da venda ou produto" autocomplete="off"></div>
    <div class="lista">${mostrar.length ? mostrar.map(v => `<div class="row clk" data-a="venda" data-v="${h(v.id)}" role="button" tabindex="0">
      <span class="l"><b>${D.numLabel(v.numero)}</b> <small>${v.dia === U.hoje() ? U.hm(v.em) : U.dataHora(v.em)} · ${h(nomePor(v.por))}</small><br><small class="trunc" style="display:block">${h(v.itens.map(i => i.qtd + '× ' + i.nome + (i.comboNome ? ' (' + i.comboNome + ')' : '')).join(', '))}</small></span>
      <span class="r"><b class="num ${v.status === 'cancelada' ? 'muted' : ''}" style="${v.status === 'cancelada' ? 'text-decoration:line-through' : ''}">${brl(v.total)}</b><br>${FormaBdg(v.forma)} ${StatusVenda(v)}</span></div>`).join('') : Vazio(q ? 'Nenhuma venda encontrada para essa busca.' : 'Nenhuma venda neste período.')}</div>
    ${lista.length > mostrar.length ? `<small>Mostrando as 300 mais recentes de ${lista.length}. Use a busca ou um período menor.</small>` : ''}
  </div>`;
};
IN.busca = el => { UI.busca = el.value; renderTela(); };
A.filtroVenda = el => { UI.filtroVenda = el.dataset.v; renderTela(); };

/* ---------------- detalhe e cancelamento ---------------- */
A.venda = el => {
  const v = S.st.vendas.get(el.dataset.v);
  if (!v) return;
  const tr = S.st.titulos.get('venda:' + v.id), tt = S.st.titulos.get('taxa:' + v.id);
  const verCusto = pode('custos_ver');
  const recTxt = !tr ? '—' : tr.status === 'realizado' ? `Recebido em ${U.dfmt(tr.realizadoEm)}` : tr.status === 'previsto' ? (tr.vencimento ? `Previsto para ${U.dfmt(tr.vencimento)}` : 'Previsão a definir (prazo da SumUp não configurado)') : tr.status === 'estornado' ? `Estornado em ${U.dfmt(tr.estornadoEm)}` : 'Cancelado antes do recebimento';
  const taxaTxt = v.forma === 'dinheiro' ? 'Sem taxa' : !tt ? '—' : U.ok(tt.valor) ? brl(tt.valor) + (tt.estimada ? ' (estimada pela taxa configurada)' : ' (apurada na conciliação)') : 'A apurar na conciliação';
  const consumo = {};
  v.itens.forEach(it => (it.consumo || []).forEach(c => { const a = consumo[c.insumoId] || (consumo[c.insumoId] = { nome: c.nome, un: c.un, qtd: 0, valor: 0, semCusto: false }); a.qtd = U.r6(a.qtd + c.qtd); if (c.custoUnit == null) a.semCusto = true; else a.valor += c.qtd * c.custoUnit; }));
  Folha.abrir({
    titulo: 'Venda ' + D.numLabel(v.numero), id: 'venda',
    corpo: `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${StatusVenda(v)} ${FormaBdg(v.forma)} <small>${U.dataHora(v.em)} · registrada por ${h(nomePor(v.por))}</small></div>
    ${Tabela([{ t: 'Item' }, { t: 'Qtd', n: 1 }, { t: 'Preço', n: 1 }, { t: 'Total', n: 1 }], v.itens.map(i => [i.nome + (i.comboNome ? ' · ' + i.comboNome : ''), i.qtd, brl(i.preco), brl(i.bruto)]))}
    <div class="lista">
      <div class="row"><span>Subtotal</span><b class="num">${brl(v.subtotal)}</b></div>
      <div class="row"><span>Desconto</span><b class="num">− ${brl(v.desconto)}</b></div>
      <div class="row"><span>Valor final</span><b class="num pl" style="font-size:18px">${brl(v.total)}</b></div>
      <div class="row"><span>Recebimento</span><span>${h(recTxt)}</span></div>
      <div class="row"><span>Taxa da maquininha</span><span>${h(taxaTxt)}</span></div>
      ${verCusto ? `<div class="row"><span>Custo dos insumos (CMV)</span><span class="num">${brl(v.custoTotal)}${v.custoPendente ? ' ' + Bdg('o', 'incompleto') : ''}</span></div>` : ''}
    </div>
    ${v.alertas && v.alertas.length ? `<div class="alerta o">${I('alerta')}<span>Na hora da venda o estoque ficou insuficiente: ${v.alertas.map(a => h(a.nome) + ' (' + U.num(a.saldoApos) + ' ' + h(a.un) + ')').join(', ')}.</span></div>` : ''}
    ${Object.keys(consumo).length ? `<details><summary style="cursor:pointer;font-weight:600">Baixa de estoque desta venda</summary>${Tabela([{ t: 'Insumo' }, { t: 'Quantidade', n: 1 }].concat(verCusto ? [{ t: 'Custo', n: 1 }] : []), Object.values(consumo).map(c => [c.nome, U.num(c.qtd) + ' ' + c.un].concat(verCusto ? [c.semCusto ? 'sem custo' : brl(c.valor)] : [])))}</details>` : `<div class="alerta p">${I('info')}<span>Os produtos desta venda estavam sem ficha técnica: nada foi baixado do estoque.</span></div>`}
    ${v.status === 'cancelada' ? `<div class="alerta r">${I('alerta')}<span><b>Cancelada</b> em ${U.dataHora(v.cancel.em)} por ${h(nomePor(v.cancel.por))}.<br>Motivo: ${h(v.cancel.motivo)}</span></div>` : ''}
    ${v.status === 'concluida' && pode('cancelar') ? `<button class="btn sec w" data-a="cancelarVenda" data-v="${h(v.id)}" style="color:var(--verm-tx);border-color:var(--vermelho)">Cancelar / estornar venda</button>` : ''}`,
  });
};

A.cancelarVenda = async el => {
  const v = S.st.vendas.get(el.dataset.v);
  if (!v || v.status !== 'concluida') return;
  const tr = S.st.titulos.get('venda:' + v.id);
  const pag = cfg('pagamentos');
  const cartao = v.forma !== 'dinheiro';
  const perguntaTaxa = cartao && tr && tr.status === 'realizado' && pag.taxaDevolvidaEstorno == null;
  const efeito = !tr ? '' : tr.status === 'realizado'
    ? `Será registrada uma <b>saída de ${brl(tr.valorRealizado)}</b> em ${h(D.nomeConta(cfg('financeiro'), tr.conta))} (estorno do valor já recebido).`
    : 'O valor ainda não foi recebido: o recebível previsto será cancelado.';
  const r = await Confirmar({
    titulo: 'Cancelar venda ' + D.numLabel(v.numero), botao: 'Confirmar cancelamento', perigo: true,
    texto: `A venda continua no histórico marcada como cancelada. Os insumos baixados voltam ao estoque e o faturamento é ajustado. ${efeito}`,
    extra: Campo('Motivo do cancelamento', 'motivo', '', { tipo: 'area', req: true, ph: 'Ex.: cliente desistiu, valor digitado errado…' })
      + (perguntaTaxa ? Sel('A SumUp devolveu a taxa desta venda?', 'taxaDev', [['nao', 'Não'], ['sim', 'Sim']], 'nao') : ''),
  });
  if (!r) return;
  const motivo = (r.motivo || '').trim();
  if (motivo.length < 5) return Toast('Informe o motivo do cancelamento (pelo menos 5 letras).', 'err');
  const taxaDevolvida = perguntaTaxa ? r.taxaDev === 'sim' : pag.taxaDevolvidaEstorno === true;
  const st = await Store.gravar({ tipo: 'cancelamento', vendaId: v.id, numero: v.numero, motivo, taxaDevolvida });
  Folha.fecharTodas();
  Toast(st === 'ok' ? 'Venda ' + D.numLabel(v.numero) + ' cancelada. Estoque e financeiro ajustados.' : 'Cancelamento guardado neste aparelho. Será enviado quando a conexão voltar.', st === 'ok' ? 'ok' : '');
};

/* ---------------- balcão: nova venda ---------------- */
let NV = null;
const novoCarrinho = () => ({ id: U.uid(), carrinho: [], desconto: 0, descTxt: '', forma: null, cat: 'Todos' });

A.novaVenda = () => {
  if (!pode('vender')) return;
  if (!NV) NV = novoCarrinho();
  Folha.abrir({ titulo: 'Nova venda', largo: true, id: 'nv', corpo: NovaVendaHTML() });
};
function prodsAtivos() { return Object.values(S.produtos).filter(p => p.ativo !== false && U.ok(p.preco) && p.preco > 0).sort((a, b) => (a.categoria || '').localeCompare(b.categoria || '') || a.nome.localeCompare(b.nome, 'pt-BR')); }

function previaVenda() {
  try {
    return { ev: D.montarVenda({ carrinho: NV.carrinho, desconto: NV.desconto, forma: NV.forma || 'dinheiro', produtos: S.produtos, insumos: S.insumos, st: S.st, cfgPag: cfg('pagamentos'), em: U.agora(), por: S.uid, id: NV.id }) };
  } catch (e) { return { erro: e.message }; }
}

function NovaVendaHTML() {
  const prods = prodsAtivos();
  const cats = ['Todos', ...new Set(prods.map(p => p.categoria || 'Outros'))];
  const vis = NV.cat === 'Todos' ? prods : prods.filter(p => (p.categoria || 'Outros') === NV.cat);
  const qtdNo = id => NV.carrinho.filter(c => c.produtoId === id).reduce((a, c) => a + c.qtd, 0);
  const sub = NV.carrinho.reduce((a, c) => a + (S.produtos[c.produtoId] ? S.produtos[c.produtoId].preco * c.qtd : 0), 0);
  const pv = NV.carrinho.length ? previaVenda() : {};
  const ev = pv.ev;
  const alertasEst = ev ? ev.alertas : [];
  const semFicha = ev ? ev.itens.filter(i => i.fichaVazia).map(i => i.nome) : [];
  const total = U.r2(sub - (NV.desconto || 0));
  return `<div class="pdv">
    <div class="form">
      ${cats.length > 2 ? Chips(cats.map(c => [c, c]), NV.cat, 'nvCat') : ''}
      <div class="prods">${vis.length ? vis.map(p => `<button type="button" class="pbtn" data-a="nvAdd" data-v="${h(p.id)}">${qtdNo(p.id) ? `<span class="q">${qtdNo(p.id)}</span>` : ''}<b>${h(p.nome)}</b>${(p.combos || []).filter(c => c.ativo !== false).length ? '<small>escolha a combinação</small>' : ''}<span class="pr num">${brl(p.preco)}</span></button>`).join('') : Vazio('Nenhum produto ativo com preço. Cadastre em Produtos e fichas.')}</div>
    </div>
    <div class="form">
      <div class="lista" id="nv-itens">${NV.carrinho.length ? NV.carrinho.map((c, i) => {
        const p = S.produtos[c.produtoId]; if (!p) return '';
        const combos = (p.combos || []).filter(x => x.ativo !== false);
        return `<div class="row" style="align-items:flex-start"><div class="l"><b>${h(p.nome)}</b><br><small class="num">${brl(p.preco)} × ${c.qtd} = ${brl(p.preco * c.qtd)}</small>
          ${combos.length ? `<div class="chips" style="margin-top:6px;flex-wrap:wrap">${combos.map(x => `<button type="button" class="chip lar ${x.id === c.comboId ? 'on' : ''}" data-a="nvCombo" data-i2="${i}" data-v="${h(x.id)}">${h(x.nome)}</button>`).join('')}</div>` : ''}</div>
          <div class="qtd"><button type="button" data-a="nvQtd" data-i2="${i}" data-v="-1" aria-label="Diminuir">${I('menos')}</button><span class="num">${c.qtd}</span><button type="button" data-a="nvQtd" data-i2="${i}" data-v="1" aria-label="Aumentar">${I('mais1')}</button><button type="button" class="rm" style="width:34px;height:34px" data-a="nvRem" data-i2="${i}" aria-label="Remover">${I('lixo')}</button></div></div>`;
      }).join('') : Vazio('Toque nos produtos para adicionar.')}</div>
      <div class="fl">${Campo('Desconto (R$)', 'nv-desc', NV.descTxt, { decimal: true, ph: '0,00', attrs: 'data-i="nvDesc"' })}<div class="campo"><span class="lbl">Total</span><span class="total-g num" id="nv-total">${brl(total)}</span></div></div>
      <div><span class="lbl">Forma de pagamento</span><div class="formas" style="margin-top:6px">${Object.entries(D.FORMAS).map(([k, l]) => `<button type="button" class="chip ${NV.forma === k ? 'on' : ''}" data-a="nvForma" data-v="${k}">${l}</button>`).join('')}</div><small>Sem parcelamento: crédito somente à vista.</small></div>
      ${alertasEst.length ? `<div class="alerta o">${I('alerta')}<span><b>Estoque insuficiente</b> (saldo depois da venda): ${alertasEst.map(a => h(a.nome) + ' ' + U.num(a.saldoApos) + ' ' + h(a.un)).join('; ')}. A venda será registrada e o saldo ficará negativo para conferência.</span></div>` : ''}
      ${semFicha.length ? `<div class="alerta p">${I('info')}<span>${h(semFicha.join(', '))} sem ficha técnica: a venda não baixará insumos nem terá custo.</span></div>` : ''}
      <form data-f="finalizarVenda"><div class="erro-form" id="nv-erro">${NV.carrinho.length && pv.erro && !/forma de pagamento/i.test(pv.erro) ? h(pv.erro) : ''}</div>
        <button type="submit" class="btn lar w" style="padding:16px;font-size:17px;margin-top:6px" ${!NV.carrinho.length || !NV.forma ? 'disabled' : ''}>${!NV.carrinho.length ? 'Adicione produtos' : !NV.forma ? 'Escolha a forma de pagamento' : 'Finalizar venda · ' + brl(total)}</button></form>
    </div></div>`;
}
const nvAtualizar = () => { if (Folha.aberta('nv')) Folha.corpo(NovaVendaHTML()); };
/** Atualiza o balcão quando chegam dados novos (estoque de outro aparelho), sem perder o desconto que está sendo digitado. */
function nvAtualizarSeguro() {
  const t = Folha.topo(); if (!t || t.id !== 'nv' || !NV) return;
  if (!t.el.querySelector('form[data-f=finalizarVenda]')) return; // tela de confirmação
  if (document.activeElement && document.activeElement.id === 'nv-desc') return;
  Folha.corpo(NovaVendaHTML());
}
A.nvCat = el => { NV.cat = el.dataset.v; nvAtualizar(); };
A.nvAdd = el => {
  const p = S.produtos[el.dataset.v]; if (!p) return;
  const combos = (p.combos || []).filter(c => c.ativo !== false);
  const comboId = combos.length ? (combos.find(c => c.padrao) || combos[0]).id : null;
  const ex = NV.carrinho.find(c => c.produtoId === p.id && c.comboId === comboId);
  if (ex) ex.qtd = Math.min(999, ex.qtd + 1); else NV.carrinho.push({ produtoId: p.id, comboId, qtd: 1 });
  nvAtualizar();
};
A.nvQtd = el => { const c = NV.carrinho[+el.dataset.i2]; if (!c) return; c.qtd = Math.max(1, Math.min(999, c.qtd + +el.dataset.v)); nvAtualizar(); };
A.nvRem = el => { NV.carrinho.splice(+el.dataset.i2, 1); nvAtualizar(); };
A.nvCombo = el => { const c = NV.carrinho[+el.dataset.i2]; if (c) c.comboId = el.dataset.v; nvAtualizar(); };
A.nvForma = el => { NV.forma = el.dataset.v; nvAtualizar(); };
IN.nvDesc = el => {
  NV.descTxt = el.value;
  const v = U.parseNum(el.value);
  NV.desconto = el.value.trim() === '' ? 0 : v;
  const sub = NV.carrinho.reduce((a, c) => a + (S.produtos[c.produtoId] ? S.produtos[c.produtoId].preco * c.qtd : 0), 0);
  const erro = document.getElementById('nv-erro'), tot = document.getElementById('nv-total');
  const bad = el.value.trim() !== '' && (!isFinite(v) || v < 0 || v > sub);
  el.classList.toggle('err', bad);
  if (erro) erro.textContent = bad ? (!isFinite(v) ? 'Desconto inválido.' : v < 0 ? 'O desconto não pode ser negativo.' : 'O desconto não pode ser maior que o subtotal (' + brl(sub) + ').') : '';
  if (tot && !bad) tot.textContent = brl(sub - (NV.desconto || 0));
  const b = el.closest('.folha').querySelector('form[data-f=finalizarVenda] button');
  if (b && NV.forma && NV.carrinho.length) { b.disabled = bad; if (!bad) b.textContent = 'Finalizar venda · ' + brl(sub - (NV.desconto || 0)); }
};

F.finalizarVenda = async () => {
  if (!NV) return;
  if (S.local.eventos.some(e => e.id === NV.id)) throw new D.Erro('Esta venda já foi registrada.');
  if (!isFinite(NV.desconto)) throw new D.Erro('Desconto inválido.');
  const ev = D.montarVenda({ carrinho: NV.carrinho, desconto: NV.desconto, forma: NV.forma, produtos: S.produtos, insumos: S.insumos, st: Store.atual(), cfgPag: cfg('pagamentos'), em: U.agora(), por: S.uid, id: NV.id });
  NV = novoCarrinho();
  const st = await Store.gravar(ev);
  const ok = st === 'ok';
  Folha.corpo(`<div class="form" style="text-align:center;align-items:center;padding:10px 0">
    <div style="width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:${ok ? 'color-mix(in srgb,var(--verde) 18%,transparent)' : 'color-mix(in srgb,var(--laranja) 18%,transparent)'};color:${ok ? 'var(--ok-tx)' : 'var(--lar-tx)'}">${I(ok ? 'ok' : 'nuvem')}</div>
    <h2>${ok ? 'Venda ' + D.numLabel(ev.numero) + ' registrada' : 'Venda guardada neste aparelho'}</h2>
    <p class="muted">${ok ? `${brl(ev.total)} · ${D.FORMAS[ev.forma]}. Estoque, financeiro e indicadores foram atualizados.` : 'Sem conexão com o banco agora. A venda está salva neste aparelho e será enviada e numerada automaticamente quando a conexão voltar. Não registre de novo.'}</p>
    ${ev.alertas.length ? `<div class="alerta o" style="text-align:left">${I('alerta')}<span>Estoque negativo após a venda: ${ev.alertas.map(a => h(a.nome) + ' (' + U.num(a.saldoApos) + ' ' + h(a.un) + ')').join(', ')}. Confira o estoque.</span></div>` : ''}
    <div class="acoes" style="width:100%"><button class="btn sec" data-a="fechar">Fechar</button><button class="btn lar" data-a="nvOutra">${I('mais1')} Nova venda</button></div></div>`);
};
A.nvOutra = () => { Folha.corpo(NovaVendaHTML()); };

/* =====================================================================
   TELA · Estoque (insumos, movimentações, compras, fornecedores)
   ===================================================================== */
const UNID = { kg: 'kg', g: 'g', L: 'L', ml: 'ml', un: 'unid.' };
const corMov = t => ({ compra: 'g', entrada: 'g', estorno_venda: 'g', venda: 'p', perda: 'r', devolucao: 'o', inventario: 'y', correcao: 'y', estorno_compra: 'r' })[t] || 'n';
const qtdTxt = (q, un) => (q > 0 ? '+' : q < 0 ? '−' : '') + U.num(Math.abs(q)) + ' ' + (UNID[un] || un || '');
const insOpts = () => Object.values(S.insumos).filter(i => i.ativo !== false).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map(i => [i.id, i.nome + ' (' + (UNID[i.unidade] || i.unidade) + ')']);

V.estoque = () => {
  const fator = cfg('geral').fatorProximo || 1.5;
  const lista = D.estoqueLista(S.st, S.insumos, fator);
  const cont = k => lista.filter(i => i.sit.k === k).length;
  const aba = UI.aba.estoque;
  const abas = [['insumos', 'Insumos'], ['movs', 'Movimentações']].concat(pode('estoque_mov') ? [['compras', 'Compras'], ['fornecedores', 'Fornecedores']] : []);
  const acoes = `<div class="acoes">${pode('estoque_mov') ? `<button class="btn" data-a="compra">${I('mais1')} Registrar compra</button><button class="btn sec" data-a="inventario">Inventário</button>` : ''}${pode('perda') ? `<button class="btn sec" data-a="movEstoque" data-v="perda">Registrar perda</button>` : ''}${pode('estoque_mov') ? `<button class="btn sec" data-a="movEstoque" data-v="entrada">Outra movimentação</button><button class="btn sec" data-a="insumoEditar" data-v="">${I('mais1')} Insumo</button>` : ''}</div>`;
  let corpo = '';
  if (aba === 'insumos') {
    const cats = ['Todas', ...cfg('geral').categoriasInsumo];
    const vis = UI.catInsumo === 'Todas' ? lista : lista.filter(i => i.categoria === UI.catInsumo);
    const totalEst = lista.reduce((a, i) => a + (i.valorEstoque || 0), 0);
    corpo = `${Chips(cats.map(c => [c, c]), UI.catInsumo, 'catInsumo')}
      <div class="card"><div class="cab"><h2>${vis.length} insumo(s)</h2>${pode('custos_ver') ? `<small>Valor em estoque (custo médio): <b class="num">${brl(totalEst)}</b></small>` : ''}</div><div class="lista">${vis.length ? vis.map(i => {
        const base = U.ok(i.minimo) && i.minimo > 0 ? i.minimo * 3 : Math.max(1, i.saldo);
        const cor = { r: 'var(--vermelho)', o: 'var(--laranja)', y: 'var(--amarelo)', g: 'var(--verde)' }[i.sit.cor];
        return `<div class="row clk" data-a="insumo" data-v="${h(i.id)}" role="button" tabindex="0" style="display:block">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b class="trunc">${h(i.nome)}</b>${Bdg(i.sit.cor, i.sit.label)}</div>
          <small><span class="num ${i.saldo < 0 ? 'neg' : ''}">${U.num(i.saldo)} ${UNID[i.unidade] || i.unidade}</span> · mínimo ${U.num(i.minimo || 0)} · ${h(i.categoria || '')}${pode('custos_ver') ? ' · custo ' + (i.cm == null ? '<span class="neg">não informado</span>' : brl(i.cm) + '/' + (UNID[i.unidade] || i.unidade) + (i.cmOrigem === 'referência' ? ' (referência)' : '')) : ''}</small>
          <div class="bar"><i style="width:${Math.max(0, Math.min(100, i.saldo / base * 100))}%;background:${cor}"></i></div></div>`;
      }).join('') : Vazio('Nenhum insumo nesta categoria.')}</div></div>`;
  } else if (aba === 'movs') {
    const p = per('estoque');
    let movs = S.st.movs.filter(m => U.dentro(m.dia, p));
    if (UI.tipoMov) movs = movs.filter(m => m.tipo === UI.tipoMov);
    if (UI.insumoMov) movs = movs.filter(m => m.insumoId === UI.insumoMov);
    movs = movs.slice().reverse();
    corpo = `${ChipsPer('estoque')}<div class="card"><div class="fl" style="margin-bottom:8px">${Sel('Tipo', 'f-tipo', Object.entries(D.TIPOS_MOV), UI.tipoMov, { vazio: 'Todos os tipos', attrs: 'data-i="tipoMov"' })}${Sel('Insumo', 'f-ins', insOpts(), UI.insumoMov, { vazio: 'Todos os insumos', attrs: 'data-i="insumoMov"' })}</div>
      ${TabelaMovs(movs.slice(0, 400))}${movs.length > 400 ? `<small>Mostrando 400 de ${movs.length}. Use os filtros ou exporte em Relatórios.</small>` : ''}</div>`;
  } else if (aba === 'compras') {
    const p = per('estoque');
    const cs = [...S.st.compras.values()].filter(c => U.dentro(c.data, p)).sort((a, b) => a.data < b.data ? 1 : -1);
    corpo = `${ChipsPer('estoque')}<div class="card">${Tabela([{ t: 'Data' }, { t: 'Fornecedor' }, { t: 'Itens' }, { t: 'Total', n: 1 }, { t: 'Situação', html: 1 }],
      cs.map(c => { const t = S.st.titulos.get('compra:' + c.id); return [U.dfmt(c.data), c.fornecedorNome || '—', c.itens.map(i => i.nome).join(', '), brl(c.total), c.status === 'cancelada' ? Bdg('r', 'Cancelada') : t && t.status === 'realizado' ? Bdg('g', 'Paga') : Bdg('o', 'A pagar ' + U.dcurta(t && t.vencimento))]; }),
      { clique: { a: 'compraDet', v: i => cs[i].id }, vazio: 'Nenhuma compra registrada neste período.' })}</div>`;
  } else {
    const fs = Object.values(S.fornecedores).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    corpo = `<button class="btn sec" data-a="fornecedor" data-v="">${I('mais1')} Fornecedor</button><div class="card"><div class="lista">${fs.length ? fs.map(f => {
      const cs = [...S.st.compras.values()].filter(c => c.fornecedorId === f.id && c.status !== 'cancelada');
      return `<div class="row clk" data-a="fornecedor" data-v="${h(f.id)}" role="button" tabindex="0"><span class="l"><b>${h(f.nome)}</b>${f.ativo === false ? ' ' + Bdg('n', 'Inativo') : ''}<br><small>${h([f.telefone, f.documento].filter(Boolean).join(' · ') || 'sem contato')}</small></span><span class="r"><small>${cs.length} compra(s)</small><br><b class="num">${brl(cs.reduce((a, c) => a + c.total, 0))}</b></span></div>`;
    }).join('') : Vazio('Nenhum fornecedor cadastrado.')}</div></div>`;
  }
  return `<div class="grid g4">
    <div class="card" style="padding:12px">${Kpi({ label: 'Insumos ativos', valor: lista.length })}</div>
    <div class="card" style="padding:12px">${Kpi({ label: 'Abaixo do mínimo', valor: `<span class="${cont('baixo') ? 'neg' : ''}">${cont('baixo')}</span>` })}</div>
    <div class="card" style="padding:12px">${Kpi({ label: 'Zerados', valor: `<span class="${cont('zero') ? 'neg' : ''}">${cont('zero')}</span>` })}</div>
    <div class="card" style="padding:12px">${Kpi({ label: 'Negativos', valor: `<span class="${cont('neg') ? 'neg' : ''}">${cont('neg')}</span>`, sub: cont('neg') ? 'conferir e corrigir' : '' })}</div></div>
    ${acoes}${Chips(abas, aba, 'abaEstoque')}${corpo}`;
};
function TabelaMovs(movs) {
  const verCusto = pode('custos_ver');
  return Tabela([{ t: 'Data' }, { t: 'Insumo' }, { t: 'Tipo', html: 1 }, { t: 'Qtd', n: 1 }].concat(verCusto ? [{ t: 'Valor', n: 1 }] : []).concat([{ t: 'Saldo', n: 1 }, { t: 'Detalhe' }, { t: 'Por' }]),
    movs.map(m => { const ins = S.insumos[m.insumoId] || {}; return [U.dataHora(m.em), m.nome || ins.nome || '—', Bdg(corMov(m.tipo), D.TIPOS_MOV[m.tipo] || m.tipo), qtdTxt(m.qtd, ins.unidade)].concat(verCusto ? [m.valor == null ? 'sem custo' : brl(Math.abs(m.valor))] : []).concat([U.num(m.saldoApos), m.motivo || refTxt(m.ref), nomePor(m.por)]); }),
    { vazio: 'Nenhuma movimentação neste período.' });
}
function refTxt(ref) {
  if (!ref) return '';
  const [t, id] = ref.split(':');
  if (t === 'venda') { const v = S.st.vendas.get(id); return 'Venda ' + (v ? D.numLabel(v.numero) : ''); }
  if (t === 'compra') { const c = S.st.compras.get(id); return 'Compra' + (c && c.fornecedorNome ? ' · ' + c.fornecedorNome : ''); }
  return '';
}
A.abaEstoque = el => { UI.aba.estoque = el.dataset.v; renderTela(); };
A.catInsumo = el => { UI.catInsumo = el.dataset.v; renderTela(); };
IN.tipoMov = el => { UI.tipoMov = el.value; renderTela(); };
IN.insumoMov = el => { UI.insumoMov = el.value; renderTela(); };

/* ---------------- detalhe e cadastro de insumo ---------------- */
A.insumo = el => {
  const i = S.insumos[el.dataset.v]; if (!i) return;
  const e = S.st.est[i.id] || { saldo: 0 };
  const c = D.custoInsumo(S.st, i);
  const sit = D.situacaoInsumo(e.saldo, i.minimo, cfg('geral').fatorProximo);
  const movs = S.st.movs.filter(m => m.insumoId === i.id).slice(-40).reverse();
  const usado = Object.values(S.produtos).filter(p => D.fichaEfetiva(p, null).some(f => f.insumoId === i.id) || (p.combos || []).some(k => (k.ficha || []).some(f => f.insumoId === i.id)));
  Folha.abrir({
    titulo: i.nome, largo: true,
    corpo: `<div style="display:flex;gap:6px;flex-wrap:wrap">${Bdg(sit.cor, sit.label)} ${Bdg('n', i.categoria || 'Sem categoria')} ${i.ativo === false ? Bdg('n', 'Inativo') : ''}</div>
    <div class="grid g3">${Kpi({ label: 'Saldo', valor: `<span class="${e.saldo < 0 ? 'neg' : ''}">${U.num(e.saldo)} ${UNID[i.unidade]}</span>` })}${Kpi({ label: 'Mínimo', valor: U.num(i.minimo || 0) + ' ' + UNID[i.unidade] })}${pode('custos_ver') ? Kpi({ label: 'Custo médio', valor: c.v == null ? '—' : brl(c.v), sub: c.origem === 'referência' ? 'custo de referência (sem compra registrada)' : c.origem ? 'por ' + UNID[i.unidade] + ' · último ' + brl(e.ultimo) : 'registre uma compra' }) : ''}</div>
    ${e.saldo < 0 ? `<div class="alerta r">${I('alerta')}<span>Saldo negativo: as vendas baixaram mais do que o estoque registrado. Faça a contagem física e registre a compra que faltou ou um ajuste de inventário.</span></div>` : ''}
    <div class="acoes">${pode('perda') ? `<button class="btn sec p" data-a="movEstoque" data-v="perda" data-ins="${h(i.id)}">Perda</button>` : ''}${pode('estoque_mov') ? `<button class="btn sec p" data-a="compra" data-ins="${h(i.id)}">Compra</button><button class="btn sec p" data-a="movEstoque" data-v="inventario" data-ins="${h(i.id)}">Ajuste de inventário</button><button class="btn sec p" data-a="movEstoque" data-v="entrada" data-ins="${h(i.id)}">Outra</button><button class="btn sec p" data-a="insumoEditar" data-v="${h(i.id)}">${I('editar')} Editar</button>` : ''}</div>
    <small>Usado em: ${usado.length ? h(usado.map(p => p.nome).join(', ')) : 'nenhuma ficha técnica'}</small>
    <h3>Últimas movimentações</h3>${TabelaMovs(movs)}`,
  });
};

A.insumoEditar = el => {
  const i = el.dataset.v ? S.insumos[el.dataset.v] : null;
  const temMov = i && S.st.movs.some(m => m.insumoId === i.id);
  const g = cfg('geral');
  const forn = Object.values(S.fornecedores).filter(f => f.ativo !== false).map(f => [f.id, f.nome]);
  Folha.fecharTodas();
  Folha.abrir({
    titulo: i ? 'Editar insumo' : 'Novo insumo',
    corpo: `<form class="form" data-f="insumo" data-id="${h(i ? i.id : '')}" data-versao="${i ? i.versao || 0 : ''}">
      ${Campo('Nome', 'nome', i ? i.nome : '', { req: true })}
      <div class="fl">${Sel('Categoria', 'categoria', g.categoriasInsumo.map(c => [c, c]), i ? i.categoria : 'Insumos')}${Sel('Unidade de medida', 'unidade', D.UNIDADES.map(u => [u, UNID[u]]), i ? i.unidade : 'kg', { attrs: temMov ? 'disabled' : '', aj: temMov ? 'Não pode mudar: já há movimentações nesta unidade.' : 'A ficha técnica e as compras usam esta unidade.' })}</div>
      <div class="fl">${Campo('Estoque mínimo', 'minimo', i ? i.minimo : '', { decimal: true, aj: 'Abaixo disso o sistema alerta.' })}${pode('custos_ver') ? Campo('Custo de referência (R$ por unidade)', 'custoRef', i ? i.custoRef : '', { decimal: true, aj: 'Usado só até a primeira compra registrada.' }) : ''}</div>
      ${Sel('Fornecedor principal', 'fornecedorId', forn, i ? i.fornecedorId : '', { vazio: 'Nenhum' })}
      ${i ? Chk('Insumo ativo', 'ativo', i.ativo !== false) : ''}
      <div class="erro-form"></div><button class="btn" type="submit">Salvar insumo</button></form>`,
  });
};
F.insumo = async f => {
  const id = f.dataset.id || 'ins-' + U.sid();
  const atual = S.insumos[id];
  const nome = valTxt(f, 'nome');
  if (nome.length < 2) throw new D.Erro('Informe o nome do insumo.');
  if (Object.values(S.insumos).some(x => x.id !== id && x.nome.trim().toLowerCase() === nome.toLowerCase())) throw new D.Erro('Já existe um insumo com esse nome.');
  const minimo = valTxt(f, 'minimo') === '' ? 0 : valNum(f, 'minimo');
  if (!isFinite(minimo) || minimo < 0) throw new D.Erro('Estoque mínimo inválido.');
  const custoRefTxt = f.querySelector('#custoRef') ? valTxt(f, 'custoRef') : null;
  const custoRef = custoRefTxt == null ? (atual ? atual.custoRef ?? null : null) : custoRefTxt === '' ? null : U.parseNum(custoRefTxt);
  if (custoRef != null && (!isFinite(custoRef) || custoRef < 0)) throw new D.Erro('Custo de referência inválido.');
  const ativo = f.querySelector('#ativo') ? valChk(f, 'ativo') : true;
  if (atual && !ativo && Object.values(S.produtos).some(p => p.ativo !== false && (D.fichaEfetiva(p, null).some(x => x.insumoId === id) || (p.combos || []).some(k => (k.ficha || []).some(x => x.insumoId === id)))))
    throw new D.Erro('Este insumo está em fichas técnicas de produtos ativos. Retire-o das fichas antes de desativar.');
  const dados = Object.assign({}, atual || {}, { nome, categoria: valTxt(f, 'categoria'), unidade: f.querySelector('#unidade').disabled ? atual.unidade : valTxt(f, 'unidade'), minimo, custoRef, fornecedorId: valTxt(f, 'fornecedorId') || null, ativo });
  await Store.salvarDoc('insumos/' + id, dados, { versao: atual ? atual.versao || 0 : null, entidade: 'insumo', nome });
  Folha.fechar(); Toast('Insumo salvo.', 'ok');
};

/* ---------------- movimentações avulsas ---------------- */
const TIPOS_AVULSOS = { perda: 'Perda / desperdício', entrada: 'Entrada avulsa (sem compra)', devolucao: 'Devolução ao fornecedor', correcao: 'Correção de estoque', inventario: 'Ajuste de inventário (contagem)' };
A.movEstoque = el => {
  const tipo = el.dataset.v;
  const opcoes = pode('estoque_mov') ? Object.entries(TIPOS_AVULSOS) : [['perda', TIPOS_AVULSOS.perda]];
  Folha.fecharTodas();
  Folha.abrir({ titulo: 'Movimentar estoque', corpo: FormMov(tipo, el.dataset.ins || '', opcoes) });
};
function FormMov(tipo, insId, opcoes) {
  const ajuda = {
    perda: 'Quantidade perdida ou descartada. Sai do estoque pelo custo médio e entra no resultado como perda.',
    entrada: 'Entrada sem compra (ex.: bonificação). Informe o custo só se quiser que ele entre no custo médio.',
    devolucao: 'Quantidade devolvida ao fornecedor. Sai do estoque pelo custo médio.',
    correcao: 'Use + para aumentar e − para diminuir (ex.: −0,5). Para erros de digitação em lançamentos anteriores.',
    inventario: 'Informe a quantidade contada fisicamente. O sistema calcula a diferença em relação ao saldo atual.',
  }[tipo];
  const ins = S.insumos[insId];
  const saldo = ins ? (S.st.est[insId] || { saldo: 0 }).saldo : null;
  return `<form class="form" data-f="movEstoque">
    ${Sel('Tipo', 'tipo', opcoes, tipo, { attrs: 'data-i="tipoMovForm"' })}
    ${Sel('Insumo', 'insumoId', insOpts(), insId, { vazio: 'Escolha o insumo', req: true, attrs: 'data-i="insMovForm"' })}
    ${saldo != null ? `<small>Saldo atual: <b class="num">${U.num(saldo)} ${UNID[ins.unidade]}</b></small>` : ''}
    <div class="fl">${Campo(tipo === 'inventario' ? 'Quantidade contada' : tipo === 'correcao' ? 'Quantidade (+/−)' : 'Quantidade', 'qtd', '', { decimal: true, req: true })}${tipo === 'entrada' && pode('custos_ver') ? Campo('Custo unitário (R$)', 'custo', '', { decimal: true }) : ''}</div>
    <small>${h(ajuda)}</small>
    ${Campo('Motivo / observação', 'motivo', '', { tipo: 'area', req: tipo !== 'entrada', ph: tipo === 'perda' ? 'Ex.: polpa descongelada, fruta estragada' : '' })}
    <div class="erro-form"></div><button class="btn" type="submit">Registrar</button></form>`;
}
IN.tipoMovForm = el => { const f = el.closest('form'); Folha.corpo(FormMov(el.value, valTxt(f, 'insumoId'), pode('estoque_mov') ? Object.entries(TIPOS_AVULSOS) : [['perda', TIPOS_AVULSOS.perda]])); };
IN.insMovForm = el => { const f = el.closest('form'); Folha.corpo(FormMov(valTxt(f, 'tipo'), el.value, pode('estoque_mov') ? Object.entries(TIPOS_AVULSOS) : [['perda', TIPOS_AVULSOS.perda]])); };
F.movEstoque = async f => {
  const tipo = valTxt(f, 'tipo');
  if (tipo !== 'perda' && !pode('estoque_mov')) throw new D.Erro('Seu perfil só pode registrar perdas.');
  const ins = S.insumos[valTxt(f, 'insumoId')];
  if (!ins) throw new D.Erro('Escolha o insumo.');
  const q = valNum(f, 'qtd');
  if (!isFinite(q)) throw new D.Erro('Informe a quantidade.');
  const motivo = valTxt(f, 'motivo');
  if (tipo !== 'entrada' && motivo.length < 3) throw new D.Erro('Informe o motivo.');
  const saldo = (S.st.est[ins.id] || { saldo: 0 }).saldo;
  const cm = D.custoInsumo(S.st, ins).v;
  let delta, extra = {};
  if (tipo === 'inventario') { if (q < 0) throw new D.Erro('A quantidade contada não pode ser negativa.'); delta = U.r6(q - saldo); extra = { contado: q, saldoSistema: saldo }; if (delta === 0) throw new D.Erro('A contagem é igual ao saldo do sistema: nada a ajustar.'); }
  else if (tipo === 'correcao') { if (q === 0) throw new D.Erro('A correção não pode ser zero.'); delta = q; }
  else { if (!(q > 0)) throw new D.Erro('A quantidade precisa ser maior que zero.'); delta = tipo === 'entrada' ? q : -q; }
  let custoUnit = cm;
  if (tipo === 'entrada' && f.querySelector('#custo') && valTxt(f, 'custo') !== '') { custoUnit = valNum(f, 'custo'); if (!isFinite(custoUnit) || custoUnit < 0) throw new D.Erro('Custo inválido.'); }
  else if (tipo === 'entrada') extra.semCusto = true;
  const it = Object.assign({ insumoId: ins.id, nome: ins.nome, qtd: delta, custoUnit: custoUnit == null ? null : U.r6(custoUnit) }, extra);
  if (tipo === 'entrada' && extra.semCusto) it.custoUnit = cm == null ? null : U.r6(cm);
  const ev = { tipo: 'estoque', subtipo: tipo, motivo: motivo || TIPOS_AVULSOS[tipo], itens: [it] };
  if (tipo === 'entrada' && !extra.semCusto) ev.itens[0].atualizaCusto = true;
  const st = await Store.gravar(ev);
  Folha.fechar();
  Toast(st === 'ok' ? `${D.TIPOS_MOV[tipo]} registrada: ${qtdTxt(delta, ins.unidade)} de ${ins.nome}.` : 'Movimentação guardada neste aparelho; será enviada quando a conexão voltar.', st === 'ok' ? 'ok' : '');
};

F.inventario = async f => {
  const itens = [];
  for (const i of Object.values(S.insumos).filter(x => x.ativo !== false)) {

const lerCompraVals = f => ({ fornecedorId: valTxt(f, 'fornecedorId'), data: valTxt(f, 'data'), documento: valTxt(f, 'documento'), pg: (f.querySelector('input[name=pg]:checked') || {}).value, conta: valTxt(f, 'conta'), pagoEm: f.querySelector('#pagoEm') ? valTxt(f, 'pagoEm') : '', vencimento: f.querySelector('#vencimento') ? valTxt(f, 'vencimento') : '' });

F.compra = async f => {

  const vistos = new Set();
  const itens = CP.itens.filter(i => i.insumoId || i.qtd || i.custo).map((i, n) => {
    const ins = S.insumos[i.insumoId];
    if (!ins) throw new D.Erro('Escolha o insumo do item ' + (n + 1) + '.');
    if (vistos.has(ins.id)) throw new D.Erro(ins.nome + ' aparece duas vezes. Junte em um item só.');

    const q = U.parseNum(i.qtd), c = U.parseNum(i.custo);

function validarFicha(linhas, onde) {
  const out = [], vistos = new Set();
  for (const l of linhas) {
    if (!l.insumoId && (l.qtd === '' || l.qtd == null)) continue;
    const ins = S.insumos[l.insumoId];
    if (!ins) throw new D.Erro('Escolha o insumo em ' + onde + '.');
    if (vistos.has(ins.id)) throw new D.Erro(ins.nome + ' aparece duas vezes em ' + onde + '.');
    vistos.add(ins.id);
    const q = U.parseNum(l.qtd);
    if (!(q > 0)) throw new D.Erro('Quantidade inválida de ' + ins.nome + ' em ' + onde + '.');
    out.push({ insumoId: ins.id, qtd: U.r6(q), classe: l.classe || D.classeDe({}, ins) });
  }
  return out;
}
F.produto = async () => {
  const id = PE.id || 'prod-' + U.sid();
  const atual = S.produtos[id];
  const nome = (PE.nome || '').trim();
  if (nome.length < 2) throw new D.Erro('Informe o nome do produto.');
  if (Object.values(S.produtos).some(x => x.id !== id && x.nome.trim().toLowerCase() === nome.toLowerCase())) throw new D.Erro('Já existe um produto com esse nome.');
  const preco = U.parseNum(PE.preco);
  if (!(preco > 0)) throw new D.Erro('Informe um preço de venda maior que zero.');
  const num = (k, nome) => { if (PE[k] === '' || PE[k] == null) return null; const v = U.parseNum(PE[k]); if (!isFinite(v) || v < 0) throw new D.Erro(nome + ' inválido.'); return v; };
  const ficha = validarFicha(PE.ficha, 'parte comum');
  const nomesC = new Set();
  const combos = PE.combos.map((c, k) => {
    const n = (c.nome || '').trim();
    if (!n) throw new D.Erro('Dê um nome à combinação ' + (k + 1) + '.');
    if (nomesC.has(n.toLowerCase())) throw new D.Erro('Há duas combinações chamadas ' + n + '.');
    nomesC.add(n.toLowerCase());
    return { id: c.id || 'k-' + U.sid(), nome: n, ativo: c.ativo !== false, ficha: validarFicha(c.ficha, 'combinação ' + n) };
  });
  const dados = Object.assign({}, atual || {}, {

  });
  delete dados.obsFicha;

};

const vencBdg = k => { if (!k) return Bdg('n', 'sem data'); const hj = U.hoje(); return k < hj ? Bdg('r', 'venceu ' + U.dcurta(k)) : k === hj ? Bdg('o', 'hoje') : Bdg('n', U.dcurta(k)); };
const categoriasFin = nat => (cfg('financeiro').categorias || []).filter(c => D.GRUPOS[c.grupo] && D.GRUPOS[c.grupo].nat === nat && !D.GRUPOS[c.grupo].sis);

V.financeiro = () => {
  const aba = UI.aba.financeiro;
  const p = per('financeiro'), cf = cfg('financeiro');
  const cx = D.caixa(S.st, cf, p);
  const rec = D.receber(S.st), pg = D.pagar(S.st, cf, U.hoje());
  const recV = rec.reduce((a, t) => a + (t.valor || 0), 0), pgV = pg.reduce((a, t) => a + (t.valor || 0), 0);
  const topo = `${ChipsPer('financeiro')}
  <div class="grid g4">
    <div class="card" style="padding:12px">${Kpi({ label: 'Saldo de caixa agora', valor: brl(cx.atual), info: 'caixa' })}</div>
    <div class="card" style="padding:12px">${Kpi({ label: 'Entradas no período', valor: `<span class="pos">${brl(cx.ent)}</span>`, info: 'recebido' })}</div>
    <div class="card" style="padding:12px">${Kpi({ label: 'Saídas no período', valor: `<span class="neg">${brl(cx.sai)}</span>` })}</div>
    <div class="card" style="padding:12px">${Kpi({ label: 'A receber / a pagar', valor: `<span class="pos">${brl(recV)}</span> / <span class="neg">${brl(pgV)}</span>`, sub: pg.some(t => !U.ok(t.valor)) ? 'há contas sem valor informado' : '' })}</div>
  </div>
  <div class="acoes"><button class="btn" data-a="lancamento" data-v="despesa">${I('menos')} Despesa</button><button class="btn sec" data-a="lancamento" data-v="receita">${I('mais1')} Receita</button><button class="btn sec" data-a="transferencia">${I('troca')} Transferência</button><button class="btn sec" data-a="irFin" data-v="receber">Conciliar SumUp</button></div>
  ${Chips([['resumo', 'Resultado'], ['caixa', 'Fluxo de caixa'], ['receber', 'A receber (' + rec.length + ')'], ['pagar', 'A pagar (' + pg.length + ')'], ['lancamentos', 'Lançamentos']], aba, 'abaFin')}`;
  return topo + ({ resumo: FinResumo, caixa: FinCaixa, receber: FinReceber, pagar: FinPagar, lancamentos: FinLancamentos })[aba](p, cx, rec, pg);
};
A.abaFin = el => { UI.aba.financeiro = el.dataset.v; renderTela(); };

function LinhasDRE(d) {
  const L = (t, v, cls = '', info = '', recuo) => `<div class="row" style="${recuo ? 'padding-left:14px' : ''}"><span>${t} ${info ? Info(info) : ''}</span><b class="num ${cls}">${v}</b></div>`;
  return `<div class="lista">
    ${L('Faturamento (vendas concluídas)', brl(d.fat), '', 'faturamento')}
    ${L('(−) Custo dos produtos vendidos', brl(d.cmv), '', 'cmv', 1)}
    ${L('= Lucro bruto', brl(d.lb), 'pl', 'lucroBruto')}
    ${L('(−) Taxas da maquininha', brl(d.taxas) + (d.tx.pendentes ? ' + ' + d.tx.pendentes + ' a apurar' : ''), '', '', 1)}
    ${L('(−) Outros custos variáveis', brl(d.outrosVar), '', '', 1)}
    ${L('= Margem de contribuição', brl(d.mc) + (d.mcPct != null ? ' · ' + U.pct(d.mcPct) : ''), 'pl', 'mc')}
    ${L('(−) Perdas e ajustes de estoque', brl(d.perdasAj), '', 'perdas', 1)}
    ${L('(−) Despesas fixas', brl(d.fixas), '', '', 1)}
    ${L('(−) Pessoal', brl(d.pessoal), '', '', 1)}
    ${L('(−) Tributos (DAS-MEI)', brl(d.tributo), '', '', 1)}
    ${L('(−) Despesas financeiras', brl(d.financeira), '', '', 1)}
    ${L('= Resultado operacional', brl(d.ro), d.ro < 0 ? 'neg' : 'pos', 'resultado')}
    ${d.outras ? L('(+) Outras receitas', brl(d.outras), '', '', 1) + L('= Resultado do período', brl(d.resultado), d.resultado < 0 ? 'neg' : 'pos') : ''}
  </div>`;
}

function FinResumo(p) {
  const cf = cfg('financeiro');
  const d = D.dre(S.st, p, cf);
  const notas = [];
  if (d.v.pend) notas.push(d.v.pend + ' venda(s) com custo incompleto (insumo sem custo ou produto sem ficha): o CMV está menor do que o real.');
  if (d.tx.pendentes) notas.push(d.tx.pendentes + ' venda(s) com taxa da SumUp ainda não apurada: ela será calculada na conciliação.');
  if (d.tx.estimadas) notas.push(d.tx.estimadas + ' taxa(s) estimada(s) pela taxa configurada; o valor real é confirmado na conciliação.');
  if (d.l.semValor) notas.push(d.l.semValor + ' despesa(s) do período ainda sem valor informado (ex.: DAS).');
  if (d.pe.semCusto) notas.push(d.pe.semCusto + ' perda(s) ou ajuste(s) sem custo do insumo.');
  const cats = Object.values(d.l.categorias).filter(c => D.GRUPOS[c.grupo] && D.GRUPOS[c.grupo].nat === 'despesa').sort((a, b) => b.valor - a.valor);
  const mx = cats.length ? cats[0].valor : 1;
  return `<div class="grid gA">
    <div class="card"><div class="cab"><h2>Resultado gerencial</h2><small>por competência · ${h(p.label)}</small></div>${LinhasDRE(d)}
      ${notas.length ? `<div class="grid" style="margin-top:10px">${notas.map(n => `<div class="alerta p">${I('info')}<span>${h(n)}</span></div>`).join('')}</div>` : ''}
      <small style="display:block;margin-top:10px">Demonstrativo gerencial. Compras de estoque, retiradas e aportes não entram no resultado (aparecem no fluxo de caixa). Não substitui a contabilidade.</small></div>
    <div class="grid" style="align-content:start">
      <div class="card"><h2>Faturamento por forma de pagamento</h2>${Rosca(d.v.porForma)}</div>
      <div class="card"><h2>Onde estão os maiores gastos</h2>${cats.length ? cats.map(c => `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px"><span class="trunc">${h(c.nome)}</span><b class="num">${brl(c.valor)}</b></div><div class="bar"><i style="width:${c.valor / mx * 100}%;background:var(--laranja)"></i></div></div>`).join('') : Vazio('Nenhuma despesa lançada no período.')}
        <small>CMV do período: <b>${brl(d.cmv)}</b> · perdas e ajustes: <b>${brl(d.perdasAj)}</b> · taxas: <b>${brl(d.taxas)}</b></small></div>
    </div></div>`;
}

function FinCaixa(p, cx) {
  const cf = cfg('financeiro');
  const ds = U.dias(p.ini, p.fim);
  const conta = UI.contaExtrato;
  const movs = cx.movs.filter(m => !conta || m.conta === conta).slice().reverse();
  let saldo = conta ? (cx.contas.find(c => c.id === conta) || {}).ini : cx.ini;
  const porDia = ds.map(d => { const x = cx.porDia[d] || { ent: 0, sai: 0 }; saldo = U.r2(saldo + x.ent - x.sai); return [d, x.ent, x.sai, saldo]; });
  return `<div class="card"><div class="cab"><h2>Saldos por conta</h2>${pode('config') ? `<button class="btn lnk" data-a="irConfig" data-v="financeiro">Saldos iniciais</button>` : ''}</div>
    ${Tabela([{ t: 'Conta' }, { t: 'Saldo inicial', n: 1 }, { t: 'Entradas', n: 1 }, { t: 'Saídas', n: 1 }, { t: 'Saldo final', n: 1 }, { t: 'Saldo agora', n: 1 }], cx.contas.map(c => [c.nome, brl(c.ini), brl(c.ent), brl(c.sai), brl(c.fim), brl(c.atual)]), { rodape: ['Total', brl(cx.ini), brl(cx.ent), brl(cx.sai), brl(cx.fim), brl(cx.atual)] })}
    ${!cf.saldoInformado ? `<div class="alerta p" style="margin-top:8px">${I('info')}<span>Os saldos iniciais ainda não foram informados (estão em R$ 0,00). Informe em Configurações → Financeiro.</span></div>` : ''}</div>
  ${ds.length > 1 ? `<div class="card"><h2>Fluxo diário</h2>${Barras(ds.map(d => U.dcurta(d)), ds.map(d => (cx.porDia[d] || {}).ent || 0), { fmt: v => brl(v), titulo: 'Entradas por dia', compara: ds.map(d => (cx.porDia[d] || {}).sai || 0) })}<div class="leg"><span><i style="background:color-mix(in srgb,var(--roxo) 30%,var(--sup2))"></i>Saídas</span><span><i style="background:var(--roxo)"></i>Entradas</span></div>
    ${Tabela([{ t: 'Dia' }, { t: 'Entradas', n: 1 }, { t: 'Saídas', n: 1 }, { t: 'Saldo no fim do dia', n: 1 }], porDia.filter(r => r[1] || r[2]).map(r => [U.dfmt(r[0]), brl(r[1]), brl(r[2]), brl(r[3])]), { vazio: 'Sem entradas ou saídas no período.' })}</div>` : ''}
  <div class="card"><div class="cab"><h2>Extrato</h2>${Sel('', 'f-conta', cf.contas.map(c => [c.id, c.nome]), conta, { vazio: 'Todas as contas', attrs: 'data-i="contaExtrato"' })}</div>
    ${Tabela([{ t: 'Data' }, { t: 'Descrição' }, { t: 'Conta' }, { t: 'Valor', n: 1, html: 1 }], movs.map(m => [U.dfmt(m.data), m.descricao, D.nomeConta(cf, m.conta), `<span class="${m.valor < 0 ? 'neg' : 'pos'}">${m.valor < 0 ? '−' : '+'}${brl(Math.abs(m.valor))}</span>`]), { vazio: 'Nenhuma entrada ou saída realizada no período.' })}</div>`;
}
IN.contaExtrato = el => { UI.contaExtrato = el.value; renderTela(); };

let SEL_REC = new Set();
function FinReceber(p, cx, rec) {
  const sumup = rec.filter(t => t.origem === 'venda');
  const outros = rec.filter(t => t.origem !== 'venda');
  SEL_REC = new Set([...SEL_REC].filter(id => sumup.some(t => t.vendaId === id)));
  const tot = sumup.filter(t => SEL_REC.has(t.vendaId)).reduce((a, t) => a + t.valor, 0);
  return `<div class="card"><div class="cab"><h2>Vendas a receber da SumUp</h2><div class="acoes"><button class="btn sec p" data-a="recSelTodos">Selecionar vencidos</button><button class="btn p" data-a="conciliar" ${SEL_REC.size ? '' : 'disabled'}>Conciliar ${SEL_REC.size ? SEL_REC.size + ' · ' + brl(tot) : ''}</button></div></div>
    <p class="muted" style="font-size:13px;margin-bottom:8px">Quando a SumUp depositar, selecione as vendas daquele repasse e informe o valor que caiu na conta. O sistema calcula a taxa real e baixa os recebíveis.</p>
    ${Tabela([{ t: '', html: 1 }, { t: 'Venda' }, { t: 'Data' }, { t: 'Forma' }, { t: 'Previsão', html: 1 }, { t: 'Bruto', n: 1 }, { t: 'Taxa prevista', n: 1 }],
      sumup.map(t => { const tt = S.st.titulos.get('taxa:' + t.vendaId); return [`<input type="checkbox" class="chk" style="width:18px;height:18px" data-i="recSel" data-v="${h(t.vendaId)}" ${SEL_REC.has(t.vendaId) ? 'checked' : ''} aria-label="Selecionar ${h(t.descricao)}">`, t.descricao.replace('Venda ', ''), U.dfmt(t.competencia), D.FORMAS[t.forma], vencBdg(t.vencimento), brl(t.valor), tt && U.ok(tt.valor) ? brl(tt.valor) : 'a apurar']; }),
      { vazio: 'Nada a receber da SumUp.', rodape: sumup.length ? ['', 'Total', '', '', '', brl(sumup.reduce((a, t) => a + t.valor, 0)), ''] : null })}</div>
  ${outros.length ? `<div class="card"><h2>Outras receitas a receber</h2>${ListaTitulos(outros)}</div>` : ''}
  <div class="card"><h2>Conciliações registradas</h2>${Tabela([{ t: 'Data' }, { t: 'Vendas', n: 1 }, { t: 'Bruto', n: 1 }, { t: 'Recebido', n: 1 }, { t: 'Taxa', n: 1 }, { t: 'Taxa %', n: 1 }, { t: 'Por' }],
    S.st.conc.slice().reverse().slice(0, 50).map(c => { const b = c.itens.reduce((a, i) => a + i.bruto, 0); return [U.dfmt(c.data), c.itens.length, brl(b), brl(c.valorRecebido), brl(b - c.valorRecebido), U.pct(b ? (b - c.valorRecebido) / b : null, 2), nomePor(c.por)]; }), { vazio: 'Nenhuma conciliação ainda.' })}</div>`;
}
IN.recSel = el => { if (el.checked) SEL_REC.add(el.dataset.v); else SEL_REC.delete(el.dataset.v); renderTela(); };
A.recSelTodos = () => { D.receber(S.st).filter(t => t.origem === 'venda' && t.vencimento && t.vencimento <= U.hoje()).forEach(t => SEL_REC.add(t.vendaId)); renderTela(); };
A.conciliar = () => {
  const tits = D.receber(S.st).filter(t => t.origem === 'venda' && SEL_REC.has(t.vendaId));
  if (!tits.length) return Toast('Selecione as vendas do repasse.', 'err');
  const bruto = tits.reduce((a, t) => a + t.valor, 0);
  const prevLiq = tits.reduce((a, t) => { const tt = S.st.titulos.get('taxa:' + t.vendaId); return a + (tt && U.ok(tt.valor) ? t.valor - tt.valor : NaN); }, 0);
  Folha.abrir({
    titulo: 'Conciliar repasse da SumUp',
    corpo: `<form class="form" data-f="conciliar"><div class="lista"><div class="row"><span>Vendas selecionadas</span><b>${tits.length}</b></div><div class="row"><span>Valor bruto</span><b class="num">${brl(bruto)}</b></div>${isFinite(prevLiq) ? `<div class="row"><span>Líquido previsto pelas taxas configuradas</span><b class="num">${brl(prevLiq)}</b></div>` : ''}</div>
      <div class="fl">${Campo('Valor que caiu na conta (R$)', 'recebido', isFinite(prevLiq) ? U.r2(prevLiq) : '', { decimal: true, req: true, attrs: `data-i="concPrev" data-b="${bruto}"` })}${Campo('Data do depósito', 'data', U.hoje(), { tipo: 'date', req: true })}</div>
      ${Sel('Conta onde caiu', 'conta', cfg('financeiro').contas.map(c => [c.id, c.nome]), 'sumup')}
      <div id="conc-prev" class="def">Informe o valor recebido para ver a taxa cobrada.</div>
      <div class="erro-form"></div><button class="btn" type="submit">Confirmar recebimento</button></form>`,
  });
  const inp = document.getElementById('recebido'); if (inp && inp.value) IN.concPrev(inp);
};
IN.concPrev = el => { const b = +el.dataset.b, r = U.parseNum(el.value), box = document.getElementById('conc-prev'); if (!box) return; box.innerHTML = isFinite(r) && r > 0 ? (r > b ? '<span class="neg">O valor recebido não pode ser maior que o bruto.</span>' : `Taxa cobrada: <b>${brl(b - r)}</b> (${U.pct((b - r) / b, 2)} do bruto).`) : 'Informe o valor recebido para ver a taxa cobrada.'; };
F.conciliar = async f => {
  const tits = D.receber(S.st).filter(t => t.origem === 'venda' && SEL_REC.has(t.vendaId));
  const data = valTxt(f, 'data');
  if (!U.validKey(data)) throw new D.Erro('Informe a data do depósito.');
  if (data > U.hoje()) throw new D.Erro('A data do depósito não pode ser futura.');
  const c = D.montarConciliacao(tits, valNum(f, 'recebido'));
  const st = await Store.gravar({ tipo: 'conciliacao', data, conta: valTxt(f, 'conta'), valorRecebido: c.recebido, itens: c.itens });
  SEL_REC.clear(); Folha.fechar();
  Toast(st === 'ok' ? `Recebimento conciliado: ${brl(c.recebido)} (taxa ${brl(c.taxa)}).` : 'Conciliação guardada neste aparelho; será enviada quando a conexão voltar.', st === 'ok' ? 'ok' : '');
};

function ListaTitulos(ts) {
  return `<div class="lista">${ts.map(t => `<div class="row clk" data-a="titulo" data-v="${h(t.ref)}" role="button" tabindex="0"><span class="l"><b class="trunc" style="display:block">${h(t.descricao)}</b><small>${h(t.categoria || (D.GRUPOS[t.grupo] || {}).label || '')} · competência ${U.dfmt(t.competencia)}</small></span><span class="r"><b class="num ${t.natureza === 'receita' ? 'pos' : ''}">${U.ok(t.valorRealizado) ? brl(t.valorRealizado) : U.ok(t.valor) ? brl(t.valor) : 'valor a informar'}</b><br>${t.status === 'previsto' ? vencBdg(t.vencimento) : ''} ${StatusTit(t)}</span></div>`).join('')}</div>`;
}
function FinPagar(p, cx, rec, pg) {
  return `<div class="card"><div class="cab"><h2>Contas a pagar</h2><small>inclui despesas recorrentes como o DAS</small></div>${pg.length ? ListaTitulos(pg) : Vazio('Nenhuma conta a pagar.')}</div>`;
}
function FinLancamentos(p) {
  const f = UI.filtroFin;
  let ts = [...S.st.titulos.values()].filter(t => U.dentro(t.competencia, p) || U.dentro(t.realizadoEm, p));
  if (f === 'receitas') ts = ts.filter(t => t.natureza === 'receita'); else if (f === 'despesas') ts = ts.filter(t => t.natureza === 'despesa');
  else if (f === 'manuais') ts = ts.filter(t => t.origem === 'manual'); else if (f === 'cancelados') ts = ts.filter(t => t.status === 'cancelado' || t.status === 'estornado');
  ts.sort((a, b) => (a.competencia < b.competencia ? 1 : -1));
  return `<div class="card"><div class="cab"><h2>Lançamentos do período</h2>${Chips([['todos', 'Todos'], ['receitas', 'Receitas'], ['despesas', 'Despesas'], ['manuais', 'Lançados à mão'], ['cancelados', 'Cancelados']], f, 'filtroFin')}</div>
    <small>Vendas, taxas e compras são lançadas automaticamente pelos outros módulos; não é preciso lançá-las de novo aqui.</small>
    ${ts.length ? ListaTitulos(ts.slice(0, 300)) : Vazio('Nenhum lançamento no período.')}</div>`;
}
A.filtroFin = el => { UI.filtroFin = el.dataset.v; renderTela(); };

/* ---------------- detalhe, baixa e cancelamento de lançamento ---------------- */
function acharTitulo(ref) { return S.st.titulos.get(ref) || D.pagar(S.st, cfg('financeiro'), U.hoje()).find(t => t.ref === ref); }
A.titulo = el => {
  const t = acharTitulo(el.dataset.v); if (!t) return;
  const cf = cfg('financeiro');
  const podeBaixar = t.status === 'previsto' && t.origem !== 'venda';
  const podeCancelar = (t.status === 'previsto' || t.status === 'realizado') && t.origem === 'manual' && !t.virtual;
  Folha.abrir({
    titulo: t.natureza === 'receita' ? 'Receita' : 'Despesa',
    corpo: `<div style="display:flex;gap:6px;flex-wrap:wrap">${StatusTit(t)} ${Bdg('n', (D.GRUPOS[t.grupo] || {}).label || t.grupo)}</div><h2>${h(t.descricao)}</h2>
      <div class="lista">
        <div class="row"><span>Valor</span><b class="num">${U.ok(t.valor) ? brl(t.valor) : 'a informar'}</b></div>
        ${U.ok(t.valorRealizado) && t.valorRealizado !== t.valor ? `<div class="row"><span>Valor pago/recebido</span><b class="num">${brl(t.valorRealizado)}</b></div>` : ''}
        <div class="row"><span>Categoria</span><span>${h(t.categoria || '—')}</span></div>
        <div class="row"><span>Competência</span><span>${U.dfmt(t.competencia)}</span></div>
        <div class="row"><span>Vencimento</span><span>${U.dfmt(t.vencimento)}</span></div>
        <div class="row"><span>Conta</span><span>${h(D.nomeConta(cf, t.conta))}</span></div>
        ${t.realizadoEm ? `<div class="row"><span>${t.natureza === 'receita' ? 'Recebido' : 'Pago'} em</span><span>${U.dfmt(t.realizadoEm)}</span></div>` : ''}
        ${t.estornadoEm ? `<div class="row"><span>Estornado em</span><span>${U.dfmt(t.estornadoEm)}</span></div>` : ''}
        ${t.motivo ? `<div class="row"><span>Motivo</span><span>${h(t.motivo)}</span></div>` : ''}
        ${t.por ? `<div class="row"><span>Lançado por</span><span>${h(nomePor(t.por))} · ${U.dataHora(t.em)}</span></div>` : ''}
      </div>
      ${t.origem === 'venda' ? `<small>Gerado automaticamente pela venda. Para alterar, cancele a venda em Vendas.</small>` : t.origem === 'compra' ? `<small>Gerado pela compra. Para desfazer, cancele a compra em Estoque → Compras.</small>` : ''}
      <div class="acoes">${podeBaixar ? `<button class="btn" data-a="baixar" data-v="${h(t.ref)}">${t.natureza === 'receita' ? 'Registrar recebimento' : 'Registrar pagamento'}</button>` : ''}${podeCancelar ? `<button class="btn sec" data-a="cancelarLanc" data-v="${h(t.ref)}" style="color:var(--verm-tx);border-color:var(--vermelho)">${t.status === 'realizado' ? 'Estornar' : 'Cancelar'}</button>` : ''}</div>`,
  });
};
A.baixar = el => {
  const t = acharTitulo(el.dataset.v); if (!t) return;
  Folha.fecharTodas();
  Folha.abrir({
    titulo: t.natureza === 'receita' ? 'Registrar recebimento' : 'Registrar pagamento',
    corpo: `<form class="form" data-f="baixar" data-ref="${h(t.ref)}"><p><b>${h(t.descricao)}</b></p>
      <div class="fl">${Campo('Valor (R$)', 'valor', U.ok(t.valor) ? t.valor : '', { decimal: true, req: true, aj: t.virtual && !U.ok(t.valor) ? 'Informe o valor da guia deste mês.' : '' })}${Campo('Data', 'data', U.hoje(), { tipo: 'date', req: true })}</div>
      ${Sel('Conta', 'conta', cfg('financeiro').contas.map(c => [c.id, c.nome]), t.conta || 'banco')}
      <div class="erro-form"></div><button class="btn" type="submit">Confirmar</button></form>`,
  });
};
F.baixar = async f => {
  const t = acharTitulo(f.dataset.ref);
  if (!t || t.status !== 'previsto') throw new D.Erro('Este lançamento já foi baixado ou cancelado.');
  const valor = valNum(f, 'valor'), data = valTxt(f, 'data');
  if (!(valor > 0)) throw new D.Erro('Informe um valor maior que zero.');
  if (!U.validKey(data)) throw new D.Erro('Informe a data.');
  if (data > U.hoje()) throw new D.Erro('A data do pagamento não pode ser futura.');
  let st;
  if (t.virtual) st = await Store.gravar({ tipo: 'lancamento', grupo: t.grupo, categoriaId: t.categoriaId, categoriaNome: t.categoria, descricao: t.descricao, valor: U.r2(valor), competencia: t.competencia, vencimento: t.vencimento, status: 'realizado', realizadoEm: data, conta: valTxt(f, 'conta'), recorrenteId: t.recorrenteId, mesRef: t.mesRef });
  else st = await Store.gravar({ tipo: 'baixa', ref: t.ref, data, valor: U.r2(valor), conta: valTxt(f, 'conta') });
  Folha.fechar(); Toast(st === 'ok' ? 'Baixa registrada.' : 'Baixa guardada neste aparelho; será enviada quando a conexão voltar.', st === 'ok' ? 'ok' : '');
};
A.cancelarLanc = async el => {
  const t = acharTitulo(el.dataset.v); if (!t) return;
  const r = await Confirmar({ titulo: t.status === 'realizado' ? 'Estornar lançamento' : 'Cancelar lançamento', perigo: true, botao: 'Confirmar', texto: t.status === 'realizado' ? `O valor de ${brl(t.valorRealizado)} volta para ${h(D.nomeConta(cfg('financeiro'), t.conta))} e o lançamento sai do resultado. O histórico é mantido.` : 'O lançamento sai das contas a pagar/receber. O histórico é mantido.', extra: Campo('Motivo', 'motivo', '', { tipo: 'area', req: true }) });
  if (!r) return;
  if ((r.motivo || '').trim().length < 3) return Toast('Informe o motivo.', 'err');
  await Store.gravar({ tipo: 'cancel_lanc', ref: t.ref, motivo: r.motivo.trim() });
  Folha.fecharTodas(); Toast('Lançamento ' + (t.status === 'realizado' ? 'estornado.' : 'cancelado.'), 'ok');
};

IN.lancSit = el => { el.closest('.chips').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.contains(el))); };
F.lancamento = async f => {
  const nat = f.dataset.nat;
  const cat = categoriasFin(nat).find(c => c.id === valTxt(f, 'categoriaId'));
  if (!cat) throw new D.Erro('Escolha a categoria.');
  const descricao = valTxt(f, 'descricao');
  if (descricao.length < 3) throw new D.Erro('Descreva o lançamento.');
  const valor = valNum(f, 'valor');
  if (!(valor > 0)) throw new D.Erro('Informe um valor maior que zero.');
  const competencia = valTxt(f, 'competencia'), data = valTxt(f, 'data');
  if (!U.validKey(competencia) || !U.validKey(data)) throw new D.Erro('Confira as datas.');
  const sit = (f.querySelector('input[name=sit]:checked') || {}).value || 'realizado';
  if (sit === 'realizado' && data > U.hoje()) throw new D.Erro('Um pagamento já feito não pode ter data futura.');
  const dup = [...S.st.titulos.values()].find(t => t.origem === 'manual' && t.status !== 'cancelado' && t.categoriaId === cat.id && t.valor === U.r2(valor) && t.competencia === competencia && (t.descricao || '').toLowerCase() === descricao.toLowerCase());
  if (dup && !f.dataset.confirmouDup) { f.dataset.confirmouDup = '1'; throw new D.Erro('Já existe um lançamento igual (mesma descrição, categoria, valor e data). Se for mesmo outro, toque em Salvar de novo.'); }
  const st = await Store.gravar({ tipo: 'lancamento', natureza: nat, grupo: cat.grupo, categoriaId: cat.id, categoriaNome: cat.nome, descricao, valor: U.r2(valor), competencia, vencimento: data, status: sit, realizadoEm: sit === 'realizado' ? data : null, conta: valTxt(f, 'conta') });
  Folha.fechar(); Toast(st === 'ok' ? 'Lançamento registrado.' : 'Lançamento guardado neste aparelho; será enviado quando a conexão voltar.', st === 'ok' ? 'ok' : '');
};
A.transferencia = () => {

      <div class="fl">${Sel('De', 'de', contas, 'sumup')}${Sel('Para', 'para', contas, 'banco')}</div>
      <div class="fl">${Campo('Valor (R$)', 'valor', '', { decimal: true, req: true })}${Campo('Data', 'data', U.hoje(), { tipo: 'date', req: true })}</div>
      ${Campo('Descrição', 'descricao', '')}<div class="erro-form"></div><button class="btn" type="submit">Registrar</button></form>`,
  });
};
F.transferencia = async f => {
  const de = valTxt(f, 'de'), para = valTxt(f, 'para'), valor = valNum(f, 'valor'), data = valTxt(f, 'data');
  if (de === para) throw new D.Erro('Escolha contas diferentes.');
  if (!(valor > 0)) throw new D.Erro('Informe um valor maior que zero.');
  if (!U.validKey(data) || data > U.hoje()) throw new D.Erro('Informe uma data válida (não futura).');
  const st = await Store.gravar({ tipo: 'transferencia', de, para, valor: U.r2(valor), data, descricao: valTxt(f, 'descricao') });
  Folha.fechar(); Toast(st === 'ok' ? 'Transferência registrada.' : 'Transferência guardada neste aparelho; será enviada quando a conexão voltar.', st === 'ok' ? 'ok' : '');
};

/* =====================================================================
   TELA · Relatórios gerenciais + exportação (Excel e PDF)
   Cada relatório gera UMA estrutura de dados usada pela tela, pelo Excel e pelo PDF,
   então os três mostram exatamente os mesmos números.
   ===================================================================== */
const RELS = {
  vendas: 'Vendas por período', faturamento: 'Faturamento', produtos: 'Produtos mais vendidos', custos: 'Custos por produto',
  despesas: 'Despesas', lucratividade: 'Lucratividade', estoque: 'Posição de estoque', movimentos: 'Movimentações de estoque',
  perdas: 'Perdas e desperdícios', caixa: 'Fluxo de caixa', comparacao: 'Comparação entre períodos', auditoria: 'Histórico de alterações',
};
// col: [título, tipo] — tipo: t texto, m dinheiro, n número, p percentual, i inteiro
const C = (t, k = 't') => ({ t, k });
const fmtCel = (v, k) => v == null || v === '' ? '' : k === 'm' ? brl(v) : k === 'n' ? U.num(v) : k === 'p' ? U.pct(v) : k === 'i' ? String(v) : String(v);

function gerarRelatorio(tipo, p) {
  const cf = cfg('financeiro');
  const R = { tipo, titulo: RELS[tipo], periodo: p.label, resumo: [], tabelas: [] };
  const T = (nome, cols, linhas, total) => R.tabelas.push({ nome, cols, linhas, total });
  if (tipo === 'vendas') {
    const vs = [...S.st.vendas.values()].filter(v => U.dentro(v.dia, p)).sort((a, b) => a.em < b.em ? -1 : 1);
    const ok = vs.filter(v => v.status === 'concluida');
    R.resumo = [['Vendas concluídas', ok.length], ['Faturamento', brl(ok.reduce((a, v) => a + v.total, 0))], ['Canceladas', vs.length - ok.length]];
    T('Vendas', [C('Nº'), C('Data'), C('Hora'), C('Itens'), C('Pagamento'), C('Subtotal', 'm'), C('Desconto', 'm'), C('Total', 'm'), C('Situação'), C('Registrada por')],
      vs.map(v => [D.numLabel(v.numero), U.dfmt(v.dia), U.hm(v.em), v.itens.map(i => i.qtd + '× ' + i.nome + (i.comboNome ? ' (' + i.comboNome + ')' : '')).join(', '), D.FORMAS[v.forma], v.subtotal, v.desconto, v.total, v.status === 'cancelada' ? 'Cancelada: ' + v.cancel.motivo : 'Concluída', nomePor(v.por)]),
      ['Total concluídas', '', '', '', '', U.r2(ok.reduce((a, v) => a + v.subtotal, 0)), U.r2(ok.reduce((a, v) => a + v.desconto, 0)), U.r2(ok.reduce((a, v) => a + v.total, 0)), '', '']);
  } else if (tipo === 'faturamento') {
    const r = D.resumoVendas(S.st, p);
    R.resumo = [['Faturamento', brl(r.fat)], ['Vendas', r.n], ['Ticket médio', brl(r.ticket)], ['Descontos concedidos', brl(r.desc)]];
    const ds = U.dias(p.ini, p.fim);
    const nDia = {}; r.vendas.forEach(v => { nDia[v.dia] = (nDia[v.dia] || 0) + 1; });
    T('Por dia', [C('Dia'), C('Vendas', 'i'), C('Faturamento', 'm'), C('Ticket médio', 'm')], ds.map(d => [U.dfmt(d) + ' (' + U.DSEM[U.dow(d)] + ')', nDia[d] || 0, r.porDia[d] || 0, nDia[d] ? r.porDia[d] / nDia[d] : null]), ['Total', r.n, r.fat, r.ticket]);
    T('Por forma de pagamento', [C('Forma'), C('Faturamento', 'm'), C('% do total', 'p')], Object.keys(D.FORMAS).map(k => [D.FORMAS[k], r.porForma[k] || 0, r.fat ? (r.porForma[k] || 0) / r.fat : null]), ['Total', r.fat, r.fat ? 1 : null]);
  } else if (tipo === 'produtos') {
    const r = D.resumoVendas(S.st, p);
    const ps = Object.values(r.porProd).sort((a, b) => b.receita - a.receita);
    R.resumo = [['Itens vendidos', r.itens], ['Faturamento', brl(r.fat)]];
    T('Ranking por receita', [C('#', 'i'), C('Produto'), C('Unidades', 'i'), C('Receita', 'm'), C('% da receita', 'p'), C('Custo (CMV)', 'm'), C('Lucro bruto', 'm'), C('Margem bruta', 'p')],
      ps.map((x, i) => [i + 1, x.nome + (x.pend ? ' *' : ''), x.qtd, x.receita, r.fat ? x.receita / r.fat : null, x.custo, x.receita - x.custo, x.receita ? (x.receita - x.custo) / x.receita : null]),
      ['', 'Total', r.itens, r.fat, r.fat ? 1 : null, r.cmv, r.fat - r.cmv, r.fat ? (r.fat - r.cmv) / r.fat : null]);
    if (ps.some(x => x.pend)) R.nota = '* produto com vendas de custo incompleto (insumo sem custo ou sem ficha técnica).';
  } else if (tipo === 'custos') {
    const a = analise();
    R.periodo = 'Posição atual (custo médio dos insumos)';
    R.resumo = [['Ponto de equilíbrio', brl(a.pe)], ['Margem de contribuição média', U.pct(a.mcMedia)], ['Despesas fixas mensais', brl(a.fixos)], ['Taxa considerada', a.taxaPct == null ? 'não configurada' : U.pct(a.taxaPct, 2)]];
    T('Custo por produto', [C('Produto'), C('Preço', 'm'), C('Matéria-prima', 'm'), C('Acompanh.', 'm'), C('Embalagens', 'm'), C('Custo direto', 'm'), C('Taxa', 'm'), C('Margem contrib.', 'm'), C('MC %', 'p'), C('Mão de obra', 'm'), C('Indiretos', 'm'), C('Custo total', 'm'), C('Margem lucro', 'p'), C('Markup', 'n'), C('Preço sugerido', 'm')],
      a.linhas.map(l => [l.nome + (l.combo ? ' (' + l.combo + ')' : '') + (l.pendentes.length ? ' *' : ''), l.preco, l.mp, l.acomp, l.emb, l.cd, l.taxaV, l.mcU, l.mcPct, l.mo, l.ciOk ? l.ci : null, l.ct, l.margem, l.markup, l.sugerido]));
    R.nota = '* custo direto incompleto: algum insumo sem custo registrado.';
  } else if (tipo === 'despesas') {
    const l = D.lancamentosPeriodo(S.st, p, cf);
    const cats = Object.values(l.categorias).filter(c => D.GRUPOS[c.grupo] && D.GRUPOS[c.grupo].nat === 'despesa').sort((a, b) => b.valor - a.valor);
    const tot = cats.reduce((a, c) => a + c.valor, 0);
    R.resumo = [['Total de despesas (competência)', brl(tot)], ['Sem valor informado', l.semValor]];
    T('Por categoria', [C('Categoria'), C('Grupo'), C('Valor', 'm'), C('% do total', 'p')], cats.map(c => [c.nome, D.GRUPOS[c.grupo].label, c.valor, tot ? c.valor / tot : null]), ['Total', '', tot, tot ? 1 : null]);
    T('Lançamentos', [C('Competência'), C('Descrição'), C('Categoria'), C('Situação'), C('Valor', 'm')], l.itens.filter(t => t.natureza === 'despesa').sort((a, b) => a.competencia < b.competencia ? -1 : 1).map(t => [U.dfmt(t.competencia), t.descricao, t.categoria || '', t.virtual ? 'a lançar' : t.status, U.ok(t.valorRealizado) ? t.valorRealizado : t.valor]));
    const compras = [...S.st.compras.values()].filter(c => U.dentro(c.data, p) && c.status !== 'cancelada');
    T('Compras de estoque (não são despesa do resultado)', [C('Data'), C('Fornecedor'), C('Total', 'm')], compras.map(c => [U.dfmt(c.data), c.fornecedorNome || '—', c.total]), ['Total', '', U.r2(compras.reduce((a, c) => a + c.total, 0))]);
  } else if (tipo === 'lucratividade') {
    const d = D.dre(S.st, p, cf);
    R.resumo = [['Faturamento', brl(d.fat)], ['Margem de contribuição', brl(d.mc) + ' (' + U.pct(d.mcPct) + ')'], ['Resultado operacional', brl(d.ro)]];
    T('Resultado gerencial', [C('Linha'), C('Valor', 'm'), C('% do faturamento', 'p')], [
      ['Faturamento', d.fat], ['(−) CMV', d.cmv], ['= Lucro bruto', d.lb], ['(−) Taxas da maquininha', d.taxas], ['(−) Outros custos variáveis', d.outrosVar], ['= Margem de contribuição', d.mc],
      ['(−) Perdas e ajustes de estoque', d.perdasAj], ['(−) Despesas fixas', d.fixas], ['(−) Pessoal', d.pessoal], ['(−) Tributos (DAS)', d.tributo], ['(−) Despesas financeiras', d.financeira], ['= Resultado operacional', d.ro], ['(+) Outras receitas', d.outras], ['= Resultado do período', d.resultado],
    ].map(([a, v]) => [a, v, d.fat ? v / d.fat : null]));
    const r = d.v;
    T('Margem por produto (sem taxas)', [C('Produto'), C('Receita', 'm'), C('CMV', 'm'), C('Lucro bruto', 'm'), C('Margem bruta', 'p')], Object.values(r.porProd).sort((a, b) => (b.receita - b.custo) - (a.receita - a.custo)).map(x => [x.nome, x.receita, x.custo, x.receita - x.custo, x.receita ? (x.receita - x.custo) / x.receita : null]));
  } else if (tipo === 'estoque') {
    const lista = D.estoqueLista(S.st, S.insumos, cfg('geral').fatorProximo || 1.5);
    R.periodo = 'Posição em ' + U.dataHora(U.agora());
    R.resumo = [['Insumos', lista.length], ['Negativos', lista.filter(i => i.sit.k === 'neg').length], ['Abaixo do mínimo', lista.filter(i => i.sit.k === 'baixo').length], ['Valor em estoque', brl(lista.reduce((a, i) => a + (i.valorEstoque || 0), 0))]];
    T('Insumos', [C('Insumo'), C('Categoria'), C('Unidade'), C('Saldo', 'n'), C('Mínimo', 'n'), C('Situação'), C('Custo médio', 'm'), C('Valor em estoque', 'm')], lista.map(i => [i.nome, i.categoria || '', UNID[i.unidade], i.saldo, i.minimo || 0, i.sit.label, i.cm, i.valorEstoque]));
  } else if (tipo === 'movimentos' || tipo === 'perdas') {
    let ms = S.st.movs.filter(m => U.dentro(m.dia, p));
    if (tipo === 'perdas') ms = ms.filter(m => ['perda', 'inventario', 'correcao', 'devolucao'].includes(m.tipo));
    const linhas = ms.map(m => { const ins = S.insumos[m.insumoId] || {}; return [U.dataHora(m.em), m.nome || ins.nome, D.TIPOS_MOV[m.tipo], m.qtd, UNID[ins.unidade] || '', m.custoUnit, m.valor, m.motivo || refTxt(m.ref), nomePor(m.por)]; });
    if (tipo === 'perdas') {
      const pe = D.perdasPeriodo(S.st, p);
      R.resumo = [['Perdas e desperdícios', brl(pe.perdas)], ['Ajustes de inventário e correções (saldo)', brl(pe.ajustes)], ['Devoluções ao fornecedor', brl(pe.devolucoes)], ['Sem custo', pe.semCusto]];
      const porIns = {};
      ms.filter(m => m.tipo === 'perda').forEach(m => { const a = porIns[m.insumoId] || (porIns[m.insumoId] = { nome: m.nome, q: 0, v: 0, un: (S.insumos[m.insumoId] || {}).unidade }); a.q = U.r6(a.q - m.qtd); a.v += -(m.valor || 0); });
      T('Perdas por insumo', [C('Insumo'), C('Quantidade', 'n'), C('Unidade'), C('Valor', 'm')], Object.values(porIns).sort((a, b) => b.v - a.v).map(x => [x.nome, x.q, UNID[x.un] || '', x.v]), ['Total', '', '', pe.perdas]);
    } else R.resumo = [['Movimentações', ms.length]];
    T(tipo === 'perdas' ? 'Lançamentos' : 'Movimentações', [C('Data'), C('Insumo'), C('Tipo'), C('Qtd', 'n'), C('Unid.'), C('Custo unit.', 'm'), C('Valor', 'm'), C('Detalhe'), C('Por')], linhas);
  } else if (tipo === 'caixa') {
    const cx = D.caixa(S.st, cf, p);
    R.resumo = [['Saldo inicial', brl(cx.ini)], ['Entradas', brl(cx.ent)], ['Saídas', brl(cx.sai)], ['Saldo final', brl(cx.fim)]];
    T('Por conta', [C('Conta'), C('Saldo inicial', 'm'), C('Entradas', 'm'), C('Saídas', 'm'), C('Saldo final', 'm')], cx.contas.map(c => [c.nome, c.ini, c.ent, c.sai, c.fim]), ['Total', cx.ini, cx.ent, cx.sai, cx.fim]);
    let s = cx.ini;
    T('Por dia', [C('Dia'), C('Entradas', 'm'), C('Saídas', 'm'), C('Saldo', 'm')], U.dias(p.ini, p.fim).map(d => { const x = cx.porDia[d] || { ent: 0, sai: 0 }; s = U.r2(s + x.ent - x.sai); return [U.dfmt(d), x.ent, x.sai, s]; }).filter(r => r[1] || r[2]));
    T('Movimentos', [C('Data'), C('Descrição'), C('Conta'), C('Valor', 'm')], cx.movs.map(m => [U.dfmt(m.data), m.descricao, D.nomeConta(cf, m.conta), m.valor]));
  } else if (tipo === 'comparacao') {
    const a = U.anterior(p);
    const d1 = D.dre(S.st, p, cf), d0 = D.dre(S.st, a, cf);
    R.periodo = p.label + ' × ' + U.dfmt(a.ini) + ' a ' + U.dfmt(a.fim);
    const L = (n, x, y, k = 'm') => [n, x, y, k === 'm' ? x - y : null, U.variacao(x, y)];
    T('Indicadores', [C('Indicador'), C('Período atual', 'm'), C('Período anterior', 'm'), C('Diferença', 'm'), C('Variação', 'p')], [
      L('Faturamento', d1.fat, d0.fat), ['Vendas', d1.v.n, d0.v.n, null, U.variacao(d1.v.n, d0.v.n)], L('Ticket médio', d1.v.ticket, d0.v.ticket), L('CMV', d1.cmv, d0.cmv), L('Lucro bruto', d1.lb, d0.lb),
      L('Taxas', d1.taxas, d0.taxas), L('Margem de contribuição', d1.mc, d0.mc), L('Perdas e ajustes', d1.perdasAj, d0.perdasAj), L('Despesas operacionais', d1.desOp, d0.desOp), L('Resultado operacional', d1.ro, d0.ro),
    ]);
    R.nota = 'A linha "Vendas" é quantidade, não valor.';
  } else if (tipo === 'auditoria') {
    const au = S.st.audit.filter(e => U.dentro(U.dkey(e.em), p)).slice().reverse();
    const canc = [...S.st.vendas.values()].filter(v => v.cancel && U.dentro(v.cancel.dia, p));
    T('Alterações de cadastros e configurações', [C('Data'), C('Usuário'), C('Cadastro'), C('Ação'), C('Campos alterados')], au.map(e => [U.dataHora(e.em), nomePor(e.por), (e.entidade || '') + ': ' + (e.nome || ''), e.acao, (e.diferencas || []).map(d => d.campo).join(', ')]));
    T('Cancelamentos de vendas', [C('Data'), C('Venda'), C('Valor', 'm'), C('Motivo'), C('Cancelado por')], canc.map(v => [U.dataHora(v.cancel.em), D.numLabel(v.numero), v.total, v.cancel.motivo, nomePor(v.cancel.por)]));

const LIBS = {
  xlsx: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  jspdf: 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
  autotable: 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js',
};
const carregados = {};
function carregar(url) {
  return carregados[url] || (carregados[url] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = url; s.async = true;
    s.onload = () => res(); s.onerror = () => { delete carregados[url]; rej(new D.Erro('Não foi possível carregar o gerador de arquivos. Verifique a internet e tente de novo.')); };
    document.head.appendChild(s);
  }));
}
const nomeArq = (base, ext) => ('acai-da-mae-' + base + '-' + U.hoje()).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9-]+/g, '-').toLowerCase() + '.' + ext;
async function salvarArquivo(filename, data) {
  if (!S.downloads) throw new D.Erro('Esta visualização não permite baixar arquivos. Abra o sistema pelo Claude no navegador ou no aplicativo.');
  try { await S.downloads.save({ filename, data }); Toast('Arquivo pronto: ' + filename, 'ok'); }
  catch (e) { if (e && e.code === 'declined') Toast('Download cancelado.'); else throw new D.Erro('Não foi possível salvar o arquivo (' + ((e && e.code) || 'erro') + ').'); }
}

function planilha(XLSX, tb) {
  const fmt = { m: '"R$" #,##0.00;[Red]-"R$" #,##0.00', p: '0.0%', n: '#,##0.###', i: '0' };
  const linhas = [tb.cols.map(c => c.t)].concat(tb.linhas).concat(tb.total ? [tb.total] : []);
  const ws = XLSX.utils.aoa_to_sheet(linhas.map(l => l.map(v => v == null ? '' : v)));
  for (let r = 1; r < linhas.length; r++) tb.cols.forEach((c, j) => { const ref = XLSX.utils.encode_cell({ r, c: j }); if (ws[ref] && typeof ws[ref].v === 'number' && fmt[c.k]) ws[ref].z = fmt[c.k]; });
  ws['!cols'] = tb.cols.map((c, j) => ({ wch: Math.min(48, Math.max(c.t.length + 2, ...linhas.slice(1, 200).map(l => String(fmtCel(l[j], c.k)).length + 1))) }));
  return ws;
}
const nomeAba = (s, usados) => { let n = s.replace(/[\\/?*[\]:]/g, ' ').slice(0, 28) || 'Dados'; let k = n, i = 2; while (usados.has(k)) k = n.slice(0, 25) + ' ' + i++; usados.add(k); return k; };

async function exportarRel(R, formato) {
  if (formato === 'xlsx') {
    await carregar(LIBS.xlsx);
    const XLSX = window.XLSX;
    const wb = XLSX.utils.book_new(), usados = new Set();
    const capa = [['Açaí da Mãe · ' + R.titulo], ['Período', R.periodo], ['Gerado em', U.dataHora(U.agora())], ['Gerado por', S.usuario ? S.usuario.nome : '']].concat(R.resumo.map(([k, v]) => [k, String(v)])).concat(R.nota ? [[R.nota]] : []);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(capa), nomeAba('Resumo', usados));
    R.tabelas.forEach(tb => XLSX.utils.book_append_sheet(wb, planilha(XLSX, tb), nomeAba(tb.nome, usados)));
    const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    return salvarArquivo(nomeArq(R.tipo, 'xlsx'), new Blob([buf]));
  }
  await carregar(LIBS.jspdf); await carregar(LIBS.autotable);
  const { jsPDF } = window.jspdf;
  const largo = R.tabelas.some(t => t.cols.length > 7);
  const doc = new jsPDF({ orientation: largo ? 'landscape' : 'portrait', unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth();
  doc.setFillColor(100, 37, 199); doc.rect(0, 0, W, 56, 'F');
  doc.setTextColor(255, 255, 255); doc.setFontSize(16); doc.text('Açaí da Mãe', 32, 26);
  doc.setFontSize(11); doc.text(R.titulo + ' · ' + R.periodo, 32, 44);
  doc.setTextColor(48, 36, 59); doc.setFontSize(9);
  let y = 74;
  doc.text('Gerado em ' + U.dataHora(U.agora()) + (S.usuario ? ' por ' + S.usuario.nome : ''), 32, y); y += 16;
  R.resumo.forEach(([k, v]) => { doc.text(k + ': ' + v, 32, y); y += 13; });
  for (const tb of R.tabelas) {
    y += 10; doc.setFontSize(11); doc.text(tb.nome, 32, y); doc.setFontSize(9);
    doc.autoTable({
      startY: y + 6, margin: { left: 32, right: 32 }, head: [tb.cols.map(c => c.t)],
      body: tb.linhas.map(l => l.map((v, j) => fmtCel(v, tb.cols[j].k))), foot: tb.total ? [tb.total.map((v, j) => fmtCel(v, tb.cols[j].k))] : undefined,
      styles: { fontSize: 7.5, cellPadding: 3 }, headStyles: { fillColor: [100, 37, 199] }, footStyles: { fillColor: [242, 237, 247], textColor: [48, 36, 59] },
      columnStyles: Object.fromEntries(tb.cols.map((c, j) => [j, { halign: c.k === 't' ? 'left' : 'right' }])),
    });
    y = doc.lastAutoTable.finalY + 14;
    if (y > doc.internal.pageSize.getHeight() - 60) { doc.addPage(); y = 40; }
  }
  if (R.nota) doc.text(R.nota, 32, Math.min(y, doc.internal.pageSize.getHeight() - 24));
  return salvarArquivo(nomeArq(R.tipo, 'pdf'), new Blob([doc.output('arraybuffer')]));
}
