<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gestão Açaí da Mãe</title>
<meta name="claude:viewport-fit-sides" content="cover"><meta name="theme-color" content="#6425C7">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: celular = barra inferior + botão laranja de venda; tablet/PC = menu lateral fixo e conteúdo em grade.
   Identidade Açaí da Mãe: roxo (principal), laranja (destaque e venda), verde (positivo), vinho (apoio). */
:root{
  --roxo:#6425C7;--roxo-forte:#5119A8;--vinho:#672A50;--laranja:#F58228;--laranja-forte:#E06F14;--verde:#42B83D;--vermelho:#D94848;--amarelo:#D99A06;
  --bg:#F6F3F9;--sup:#FFFFFF;--sup2:#F2EDF7;--tx:#2E2238;--tx2:#695F75;--ln:#E7E0EE;
  --roxo-tx:#5B1FBA;--ok-tx:#257A22;--verm-tx:#BF3434;--lar-tx:#A95310;--ama-tx:#8A6200;
  --sombra:0 1px 2px rgba(48,36,59,.06),0 2px 8px rgba(48,36,59,.06);
  --veu:rgba(30,20,40,.5);
  --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --raio:16px;--raio-p:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141018;--sup:#1F1826;--sup2:#2A2133;--tx:#F2EDF7;--tx2:#ADA1BA;--ln:#382D43;
  --roxo-tx:#C3A2FF;--ok-tx:#76D672;--verm-tx:#FF9090;--lar-tx:#FFAE6B;--ama-tx:#F2C55C;
  --sombra:0 1px 2px rgba(0,0,0,.3);--veu:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141018;--sup:#1F1826;--sup2:#2A2133;--tx:#F2EDF7;--tx2:#ADA1BA;--ln:#382D43;
  --roxo-tx:#C3A2FF;--ok-tx:#76D672;--verm-tx:#FF9090;--lar-tx:#FFAE6B;--ama-tx:#F2C55C;
  --sombra:0 1px 2px rgba(0,0,0,.3);--veu:rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
.num,td.n,th.n,.kpi .v,.money{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;font-weight:650}
h3{font-size:14px;font-weight:650}
p{margin:0}
small,.muted{color:var(--tx2)}
small{font-size:12px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- estrutura ---------- */
#app{min-height:100%}
.side{display:none}
.main{min-width:0;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid transparent}
.top.sombra{border-bottom-color:var(--ln)}
.top .tt{flex:1;min-width:0}
.top .tt b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:1180px;margin:0 auto;padding-block:4px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.logo{width:42px;height:42px;border-radius:50%;background:var(--laranja);border:3px solid var(--verde);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.logo.g{width:120px;height:120px;font-size:22px;border-width:6px;line-height:1.05;text-align:center}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--sup);border-top:1px solid var(--ln);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:11px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.tabbar button.on{color:var(--roxo-tx);font-weight:650}
.tabbar .ic{width:22px;height:22px}
.fab{position:fixed;z-index:8;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));border:0;border-radius:28px;
  background:var(--laranja);color:#fff;font-weight:700;font-size:15px;padding:14px 20px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(245,130,40,.4)}
.fab:hover{background:var(--laranja-forte)}

@media (min-width:960px){
  .side{display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;width:236px;background:var(--sup);border-right:1px solid var(--ln);padding:18px 12px;gap:4px;z-index:7;overflow-y:auto}
  .side .marca{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
  .side .marca b{display:block;font-size:16px}
  .side button.nv{border:0;background:none;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--tx2);font-weight:550;text-align:left}
  .side button.nv:hover{background:var(--sup2);color:var(--tx)}
  .side button.nv.on{background:color-mix(in srgb,var(--roxo) 12%,transparent);color:var(--roxo-tx)}
  .side .rod{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--ln);font-size:12px;color:var(--tx2)}
  .main{margin-left:236px;padding-bottom:24px}
  .tabbar,.fab{display:none}
  .so-movel{display:none!important}
}
@media (max-width:959px){.so-pc{display:none!important}}

/* ---------- componentes ---------- */
.card{background:var(--sup);border-radius:var(--raio);padding:16px;box-shadow:var(--sombra);min-width:0}
.card.plano{box-shadow:none;border:1px solid var(--ln)}
.card>h2{margin-bottom:10px}
.cab{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cab h2{margin:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.gA{grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.gA{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.g2m{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.g3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln);min-width:0}
.row:last-child{border-bottom:0}
.row>.l{min-width:0;flex:1}
.row>.r{text-align:right;flex:none}
.row.clk{cursor:pointer}
.row.clk:hover{background:linear-gradient(90deg,transparent,var(--sup2),transparent)}
.lista{display:flex;flex-direction:column}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lb{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:4px}
.kpi .v{font-size:20px;font-weight:750;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v.g{font-size:26px}
.kpi .d{font-size:11px;font-weight:600}
.up{color:var(--ok-tx)}.down{color:var(--verm-tx)}.neutro{color:var(--tx2)}
.pos{color:var(--ok-tx)}.neg{color:var(--verm-tx)}.pl{color:var(--roxo-tx)}
.destaque{background:linear-gradient(135deg,var(--roxo),var(--vinho));color:#fff}
.destaque .kpi .lb,.destaque small{color:rgba(255,255,255,.82)}
.destaque .d{color:#fff}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--ln);background:var(--sup);border-radius:20px;padding:7px 13px;font-size:13px;color:var(--tx)}
.chip.on{background:var(--roxo);color:#fff;border-color:var(--roxo)}
.chip.lar.on{background:var(--laranja);border-color:var(--laranja)}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:650;font-size:15px;background:var(--roxo);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{background:var(--roxo-forte)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.lar{background:var(--laranja)}.btn.lar:hover{background:var(--laranja-forte)}
.btn.ver{background:var(--verde)}
.btn.sec{background:var(--sup);color:var(--roxo-tx);border:1px solid color-mix(in srgb,var(--roxo) 45%,var(--ln))}
.btn.sec:hover{background:var(--sup2)}
.btn.perigo{background:var(--vermelho)}
.btn.lnk{background:none;color:var(--roxo-tx);padding:6px 4px;font-size:14px}
.btn.p{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.w{width:100%}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.acoes>.btn{flex:1 1 auto}
.ib{border:0;background:var(--sup);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;box-shadow:var(--sombra);position:relative;flex:none}
.ib .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--vermelho);border:2px solid var(--sup)}
.av{background:var(--roxo);color:#fff;font-weight:700;font-size:13px}

.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:650;border-radius:10px;padding:3px 8px;white-space:nowrap;vertical-align:middle}
.b-g{background:color-mix(in srgb,var(--verde) 17%,transparent);color:var(--ok-tx)}
.b-o{background:color-mix(in srgb,var(--laranja) 18%,transparent);color:var(--lar-tx)}
.b-y{background:color-mix(in srgb,var(--amarelo) 18%,transparent);color:var(--ama-tx)}
.b-r{background:color-mix(in srgb,var(--vermelho) 16%,transparent);color:var(--verm-tx)}
.b-p{background:color-mix(in srgb,var(--roxo) 14%,transparent);color:var(--roxo-tx)}
.b-n{background:var(--sup2);color:var(--tx2)}

.alerta{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13px}
.alerta .ic{margin-top:1px}
.alerta.r{background:color-mix(in srgb,var(--vermelho) 11%,var(--sup));color:var(--tx)}
.alerta.r .ic{color:var(--verm-tx)}
.alerta.o{background:color-mix(in srgb,var(--laranja) 12%,var(--sup))}
.alerta.o .ic{color:var(--lar-tx)}
.alerta.p{background:color-mix(in srgb,var(--roxo) 9%,var(--sup))}
.alerta.p .ic{color:var(--roxo-tx)}
.alerta b{font-weight:650}

.bar{height:6px;background:var(--sup2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px}
.empil{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sup2)}
.empil i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--tx2);margin-top:8px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* gráficos */
.graf{width:100%;height:auto;display:block}
.graf .bx{fill:var(--roxo)}
.graf .bx.max{fill:var(--laranja)}
.graf .bx.ant{fill:color-mix(in srgb,var(--roxo) 30%,var(--sup2))}
.graf .bx:hover,.graf .bx.sel{fill:var(--vinho)}
.graf .gl{stroke:var(--ln);stroke-width:1}
.graf text{fill:var(--tx2);font-size:10px;font-family:var(--f)}
.graf text.vl{fill:var(--tx);font-weight:650}
.legenda-graf{min-height:20px;font-size:13px;color:var(--tx2);margin-top:4px}
.donut{width:104px;height:104px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:24px;background:var(--sup);border-radius:50%}

/* tabelas */
.tab-wrap{overflow-x:auto;margin:0 -4px}
table.t{border-collapse:collapse;width:100%;font-size:13px;min-width:100%}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx2);font-weight:650;text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln);white-space:nowrap}
table.t td{padding:9px 6px;border-bottom:1px solid var(--ln);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t .n{text-align:right;white-space:nowrap}
table.t tfoot td{font-weight:700;border-top:2px solid var(--ln)}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:var(--sup2)}

/* formulários */
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo label,.lbl{font-size:12px;font-weight:600;color:var(--tx2)}
.campo .aj{font-size:12px;color:var(--tx2)}
input.in,select.in,textarea.in{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:var(--raio-p);background:var(--sup);font-size:15px;min-width:0}
textarea.in{min-height:72px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--roxo);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--roxo) 18%,transparent)}
input.in.err,select.in.err{border-color:var(--vermelho)}
.form{display:flex;flex-direction:column;gap:12px}
.fl{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fl3{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:480px){.fl3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--roxo)}
.erro-form{color:var(--verm-tx);font-size:13px;font-weight:550}
.erro-form:empty{display:none}
.linha-item{display:grid;grid-template-columns:minmax(0,1fr) 96px 40px;gap:8px;align-items:end}
.linha-item.c4{grid-template-columns:minmax(0,1fr) 92px 150px 40px}
@media (max-width:480px){.linha-item.c4{grid-template-columns:minmax(0,1fr) 80px 40px}.linha-item.c4 .sm-full{grid-column:1/-1}}
.rm{border:0;background:var(--sup2);border-radius:10px;height:44px;display:grid;place-items:center;color:var(--verm-tx)}
.secao{border-top:1px solid var(--ln);padding-top:12px;margin-top:4px}

/* folhas (modais) */
.veu{position:fixed;inset:0;background:var(--veu);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--sup);width:100%;max-height:94%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.folha-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-16px;background:var(--sup);margin:-16px -16px 0;padding:16px 16px 8px;z-index:2}
.folha-cab b{font-size:18px}
.folha-cab .x{border:0;background:var(--sup2);border-radius:50%;width:34px;height:34px;display:grid;place-items:center}
@media (min-width:700px){.veu{align-items:center;padding:24px}.folha{max-width:620px;border-radius:20px;max-height:90vh}.folha.largo{max-width:980px}}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
@media (min-width:960px){.toasts{bottom:28px;left:calc(50% + 118px)}}
.toast{background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--vermelho);color:#fff}
.toast.ok{background:#256f22;color:#fff}

.faixa{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;font-size:13px;background:color-mix(in srgb,var(--laranja) 14%,var(--sup))}
.info{border:1px solid var(--ln);background:var(--sup);color:var(--tx2);width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0;font-style:italic;font-family:Georgia,serif;flex:none}
.vazio{text-align:center;padding:24px 12px;color:var(--tx2);display:flex;flex-direction:column;gap:8px;align-items:center}
.vazio .ic{width:36px;height:36px;color:color-mix(in srgb,var(--roxo) 55%,var(--tx2))}

/* balcão de vendas */
.pdv{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.pdv{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.prods{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:520px){.prods{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pbtn{border:1px solid var(--ln);background:var(--sup);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative;min-height:78px}
.pbtn:hover{border-color:var(--roxo)}
.pbtn b{font-size:14px;line-height:1.25}
.pbtn .pr{font-weight:700;color:var(--roxo-tx);margin-top:auto}
.pbtn .q{position:absolute;top:8px;right:8px;background:var(--laranja);color:#fff;border-radius:12px;min-width:24px;height:24px;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.qtd{display:flex;align-items:center;gap:6px}
.qtd button{width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:var(--sup);display:grid;place-items:center}
.qtd span{min-width:24px;text-align:center;font-weight:700}
.total-g{font-size:28px;font-weight:800;color:var(--roxo-tx);letter-spacing:-.02em}
.formas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.formas .chip{text-align:center;padding:10px 4px;border-radius:12px}

.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login .card{max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center;padding:28px 22px}
.slogan{color:var(--lar-tx);font-weight:650}
.def{background:var(--sup2);border-radius:10px;padding:10px 12px;font-size:13px}
.def code{font-family:ui-monospace,Menlo,monospace;font-size:12px}
@media (prefers-reduced-motion:no-preference){.folha{animation:sobe .18s ease-out}@keyframes sobe{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}

.hero{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero>:first-child{grid-column:1/-1}
@media (min-width:700px){.hero{grid-template-columns:repeat(3,minmax(0,1fr))}.hero>:first-child{grid-column:auto}}
@media (max-width:520px){.tri{gap:8px}.tri .card{padding:10px!important}.tri .kpi .v{font-size:15px}}
.logo.img{border:0;background:transparent}
</style>

/* =====================================================================
   NÚCLEO · utilidades de texto, números, dinheiro e datas
   Fuso oficial do sistema: America/Fortaleza (UTC−3, sem horário de verão)
   ===================================================================== */
const TZ = 'America/Fortaleza';

const U = (() => {
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);
  const uid = () => (globalThis.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
  const sid = () => uid().replace(/-/g, '').slice(0, 16);

  // Arredondamentos: dinheiro sempre em 2 casas; quantidades em até 6.
  const r2 = v => { const x = Math.round((+v + Number.EPSILON) * 100) / 100; return x === 0 ? 0 : x; };
  const r6 = v => { const x = Math.round(+v * 1e6) / 1e6; return x === 0 ? 0 : x; };
  const ok = v => v != null && v !== '' && isFinite(v);

  const fBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const brl = v => ok(v) ? fBRL.format(r2(v)) : '—';
  const num = (v, d = 3) => ok(v) ? (+v).toLocaleString('pt-BR', { maximumFractionDigits: d }) : '—';
  const pct = (v, d = 1) => ok(v) ? (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%' : '—';
  /** Aceita "12,5", "1.234,56", "12.5" e números. Vazio → NaN. */
  const parseNum = s => {
    if (typeof s === 'number') return s;
    s = String(s ?? '').trim().replace(/\s|R\$/g, '');
    if (!s) return NaN;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    return Number(s);
  };

  // ---- datas (chaves AAAA-MM-DD no fuso de Fortaleza) ----
  const dtf = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
  const tf = new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const hf = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', hourCycle: 'h23' });
  const dkey = iso => dtf.format(new Date(iso));
  const hm = iso => tf.format(new Date(iso));

  const hoje = () => dkey(agora());
  const k2d = k => { const [y, m, d] = k.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const d2k = d => d.toISOString().slice(0, 10);
  const validKey = k => /^\d{4}-\d{2}-\d{2}$/.test(k || '') && d2k(k2d(k)) === k;
  const addDias = (k, n) => { const d = k2d(k); d.setUTCDate(d.getUTCDate() + n); return d2k(d); };
  const diffDias = (a, b) => Math.round((k2d(b) - k2d(a)) / 864e5);
  const dow = k => (k2d(k).getUTCDay() + 6) % 7; // 0 = segunda … 6 = domingo

  const mesKey = k => k.slice(0, 7);
  const addMes = (mk, n) => { const d = k2d(mk + '-01'); d.setUTCMonth(d.getUTCMonth() + n); return d2k(d).slice(0, 7); };

  const dcurta = k => k ? k.slice(8, 10) + '/' + k.slice(5, 7) : '—';
  const dataHora = iso => iso ? dfmt(dkey(iso)) + ' · ' + hm(iso) : '—';
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const DSEM = ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'];
  const mesNome = mk => MESES[+mk.slice(5, 7) - 1] + ' de ' + mk.slice(0, 4);
  const dias = (a, b) => { const r = []; for (let d = a; d <= b; d = addDias(d, 1)) r.push(d); return r; };

    if (tipo === 'semana') { const i = inicioSemana(h); return { tipo, ini: i, fim: h, label: 'Semana · ' + dcurta(i) + ' a ' + dcurta(h) }; }
    if (tipo === 'mes') return { tipo, ini: inicioMes(h), fim: h, label: 'Mês · ' + dcurta(inicioMes(h)) + ' a ' + dcurta(h) };
    if (tipo === '30d') return { tipo, ini: addDias(h, -29), fim: h, label: 'Últimos 30 dias' };

    if (p.tipo === 'hoje') { const d = addDias(p.ini, -7); return { ini: d, fim: d, label: 'mesmo dia da semana anterior (' + dcurta(d) + ')' }; }
    if (p.tipo === 'semana') return { ini: addDias(p.ini, -7), fim: addDias(p.fim, -7), label: 'mesmos dias da semana anterior' };
    if (p.tipo === 'mes') {
      const pi = inicioMes(addDias(p.ini, -1)), lim = fimMes(pi);
      const f = pi.slice(0, 8) + p.fim.slice(8, 10);
      return { ini: pi, fim: validKey(f) && f <= lim ? f : lim, label: 'mesmo período do mês anterior' };
    }
    const n = diffDias(p.ini, p.fim) + 1;
    return { ini: addDias(p.ini, -n), fim: addDias(p.ini, -1), label: 'período anterior de ' + n + ' dia(s)' };
  };

  return {
    esc, uid, sid, r2, r6, ok, brl, num, pct, parseNum,
    dkey, hm, hora, agora, hoje, validKey, addDias, diffDias, dow, addUteis, inicioSemana, inicioMes, fimMes,
    mesKey, addMes, dfmt, dcurta, dataHora, mesNome, MESES, DSEM, dias, dentro, periodo, anterior, variacao,
  };
})();

const D = (() => {

        status: real ? 'realizado' : 'previsto', realizadoEm: real ? ev.realizadoEm : null, valorRealizado: real ? ev.valor : null,

    const add = it => { if (!it || !it.insumoId || !(+it.qtd > 0)) return; const a = m.get(it.insumoId); if (a) a.qtd = r6(a.qtd + +it.qtd); else m.set(it.insumoId, { insumoId: it.insumoId, qtd: +it.qtd, classe: it.classe }); };

  function montarVenda({ carrinho, desconto, forma, produtos, insumos, st, cfgPag, em, por, id }) {

      if ((p.combos || []).some(x => x.ativo !== false)) exigir(combo && combo.ativo !== false, 'Escolha a combinação de ' + p.nome + '.');

    }

    exigir(desc <= subtotal, 'O desconto não pode ser maior que o subtotal (' + UU.brl(subtotal) + ').');
    const total = r2(subtotal - desc);
    exigir(total > 0, 'O valor final precisa ser maior que zero. Para cortesia, registre uma perda no estoque.');

    // rateio do desconto entre os itens (proporcional; o último recebe o arredondamento)
    let resto = desc;
    const saldoProj = {};
    const alertas = [];
    let custoTotal = 0, custoPendente = false;
    const out = itens.map((x, i) => {
      const dItem = i === itens.length - 1 ? r2(resto) : r2(desc * x.bruto / subtotal);
      resto = r2(resto - dItem);
      const ficha = fichaEfetiva(x.p, x.combo && x.combo.id);
      const consumo = ficha.map(f => {
        const ins = insumos[f.insumoId];
        if (!ins) return null;
        const cu = custoInsumo(st, ins).v;
        return { insumoId: ins.id, nome: ins.nome, un: ins.unidade, qtd: r6(f.qtd * x.qtd), custoUnit: cu == null ? null : r6(cu) };
      }).filter(Boolean);
      let ci = 0, pend = consumo.length === 0;
      for (const c of consumo) {
        if (c.custoUnit == null) pend = true; else ci += c.qtd * c.custoUnit;
        const base = saldoProj[c.insumoId] != null ? saldoProj[c.insumoId] : ((st && st.est[c.insumoId]) ? st.est[c.insumoId].saldo : 0);
        saldoProj[c.insumoId] = r6(base - c.qtd);
      }
      custoTotal += ci; if (pend) custoPendente = true;
      return {
        produtoId: x.p.id, nome: x.p.nome, comboId: x.combo ? x.combo.id : null, comboNome: x.combo ? x.combo.nome : null,
        preco: x.p.preco, qtd: x.qtd, bruto: x.bruto, desconto: dItem, total: r2(x.bruto - dItem),
        custoTotal: r2(ci), custoPendente: pend, fichaVazia: consumo.length === 0, consumo,
      };
    });
    for (const k in saldoProj) if (saldoProj[k] < 0) alertas.push({ insumoId: k, nome: insumos[k].nome, un: insumos[k].unidade, saldoApos: saldoProj[k] });

    const dia = dkey(em);
    const cf = (cfgPag && cfgPag[forma]) || {};
    let taxaValor = null;
    if (forma !== 'dinheiro' && ok(cf.taxa)) taxaValor = r2(total * +cf.taxa / 100 + (ok(cf.taxaFixa) ? +cf.taxaFixa : 0));
    return {
      id, tipo: 'venda', em, por, numero: null, itens: out, subtotal, desconto: desc, total, forma,
      pag: {
        conta: cf.conta || (forma === 'dinheiro' ? 'caixa' : 'sumup'),
        taxaPct: forma === 'dinheiro' ? 0 : (ok(cf.taxa) ? +cf.taxa : null),
        taxaFixa: forma === 'dinheiro' ? 0 : (ok(cf.taxaFixa) ? +cf.taxaFixa : null),
        taxaValor: forma === 'dinheiro' ? 0 : taxaValor,
        liquido: forma === 'dinheiro' ? total : (taxaValor == null ? null : r2(total - taxaValor)),
        prazo: forma === 'dinheiro' ? 0 : (ok(cf.prazo) ? +cf.prazo : null), tipoPrazo: cf.tipoPrazo || 'corridos',
        prevista: forma === 'dinheiro' ? dia : prevista(dia, cf),
      },
      custoTotal: r2(custoTotal), custoPendente, alertas,
    };
  }

  /** Conciliação SumUp: rateia o valor recebido entre as vendas proporcionalmente ao bruto. */
  function montarConciliacao(titulos, valorRecebido) {
    exigir(titulos.length, 'Selecione pelo menos uma venda a receber.');
    const bruto = r2(titulos.reduce((a, t) => a + t.valor, 0));
    const rec = r2(valorRecebido);
    exigir(ok(valorRecebido) && rec > 0, 'Informe o valor que a SumUp depositou.');
    exigir(rec <= bruto, 'O valor recebido (' + UU.brl(rec) + ') não pode ser maior que o valor bruto das vendas (' + UU.brl(bruto) + ').');
    let restoL = rec;
    const itens = titulos.map((t, i) => {
      const liq = i === titulos.length - 1 ? r2(restoL) : r2(rec * t.valor / bruto);
      restoL = r2(restoL - liq);
      return { vendaId: t.vendaId, bruto: t.valor, liquido: liq, taxa: r2(t.valor - liq) };
    });
    return { bruto, recebido: rec, taxa: r2(bruto - rec), taxaPct: bruto ? (bruto - rec) / bruto : 0, itens };
  }

  /* ------------------------------------------------------------------
     CONSULTAS (selectors) — sempre a partir do estado calculado
     ------------------------------------------------------------------ */
  function resumoVendas(st, p) {
    const r = { fat: 0, bruto: 0, desc: 0, n: 0, cmv: 0, pend: 0, canc: 0, cancV: 0, itens: 0, porForma: {}, porDia: {}, porHora: {}, porProd: {}, vendas: [] };
    for (const v of st.vendas.values()) {
      if (!dentro(v.dia, p)) continue;
      if (v.status === 'cancelada') { r.canc++; r.cancV = r2(r.cancV + v.total); continue; }
      r.vendas.push(v);
      r.n++; r.fat = r2(r.fat + v.total); r.bruto = r2(r.bruto + v.subtotal); r.desc = r2(r.desc + v.desconto);
      r.cmv = r2(r.cmv + (v.custoTotal || 0)); if (v.custoPendente) r.pend++;
      r.porForma[v.forma] = r2((r.porForma[v.forma] || 0) + v.total);
      r.porDia[v.dia] = r2((r.porDia[v.dia] || 0) + v.total);
      const h = UU.hora(v.em); r.porHora[h] = r2((r.porHora[h] || 0) + v.total);
      for (const it of v.itens) {
        const a = r.porProd[it.produtoId] || (r.porProd[it.produtoId] = { id: it.produtoId, nome: it.nome, qtd: 0, receita: 0, custo: 0, pend: 0 });
        a.qtd += it.qtd; a.receita = r2(a.receita + it.total); a.custo = r2(a.custo + (it.custoTotal || 0)); if (it.custoPendente) a.pend++;
        r.itens += it.qtd;
      }
    }
    r.ticket = r.n ? r.fat / r.n : null;
    return r;
  }

  function taxasPeriodo(st, p) {
    const r = { total: 0, pendentes: 0, estimadas: 0, reais: 0 };
    for (const t of st.titulos.values()) {
      if (t.grupo !== 'taxas' || !dentro(t.competencia, p) || !(t.status === 'previsto' || t.status === 'realizado')) continue;
      if (!ok(t.valor)) { r.pendentes++; continue; }
      r.total = r2(r.total + t.valor);
      if (t.estimada) r.estimadas++; else r.reais++;
    }
    return r;
  }

  /** Lançamentos manuais e recorrentes por competência (exclui vendas, taxas e compras de estoque). */
  function lancamentosPeriodo(st, p, cfgFin) {
    const r = { grupos: {}, categorias: {}, itens: [], semValor: 0 };
    const add = (t) => {
      const v = ok(t.valorRealizado) ? t.valorRealizado : t.valor;
      if (!ok(v)) { r.semValor++; return; }
      r.grupos[t.grupo] = r2((r.grupos[t.grupo] || 0) + v);
      const ck = (t.categoria || GRUPOS[t.grupo]?.label || 'Sem categoria');
      r.categorias[ck] = r.categorias[ck] || { nome: ck, grupo: t.grupo, valor: 0 };
      r.categorias[ck].valor = r2(r.categorias[ck].valor + v);
      r.itens.push(t);
    };
    for (const t of st.titulos.values()) {
      if (t.origem !== 'manual' || !dentro(t.competencia, p) || !(t.status === 'previsto' || t.status === 'realizado')) continue;
      add(t);
    }
    for (const t of recorrentesVirtuais(st, cfgFin, p.fim)) if (dentro(t.competencia, p)) add(t);
    return r;
  }

  function perdasPeriodo(st, p) {
    const r = { perdas: 0, ajustes: 0, devolucoes: 0, semCusto: 0, itens: [] };
    for (const m of st.movs) {
      if (!dentro(m.dia, p) || !['perda', 'inventario', 'correcao', 'devolucao'].includes(m.tipo)) continue;
      r.itens.push(m);
      if (m.valor == null) { r.semCusto++; continue; }
      if (m.tipo === 'perda') r.perdas = r2(r.perdas - m.valor);
      else if (m.tipo === 'devolucao') r.devolucoes = r2(r.devolucoes - m.valor);
      else r.ajustes = r2(r.ajustes + m.valor);
    }
    return r;
  }

  /** Resultado gerencial (regime de competência). */
  function dre(st, p, cfgFin) {
    const v = resumoVendas(st, p), tx = taxasPeriodo(st, p), l = lancamentosPeriodo(st, p, cfgFin), pe = perdasPeriodo(st, p);
    const g = k => l.grupos[k] || 0;
    const lb = r2(v.fat - v.cmv);
    const mc = r2(lb - tx.total - g('custo_variavel'));
    const perdasAj = r2(pe.perdas - pe.ajustes);
    const desOp = r2(DESP_OPER.reduce((a, k) => a + g(k), 0));
    const ro = r2(mc - perdasAj - desOp);
    return {
      v, tx, l, pe, fat: v.fat, cmv: v.cmv, lb, taxas: tx.total, outrosVar: g('custo_variavel'), mc, mcPct: v.fat ? mc / v.fat : null,
      perdasAj, desOp, fixas: g('despesa_fixa'), pessoal: g('pessoal'), tributo: g('tributo'), financeira: g('financeira'),
      ro, outras: g('outras_receitas'), resultado: r2(ro + g('outras_receitas')),
    };
  }

  /** Despesas recorrentes (ex.: DAS) ainda não lançadas viram contas a pagar previstas, mês a mês. */
  function recorrentesVirtuais(st, cfgFin, ateDia) {
    const out = [];
    if (!cfgFin || !cfgFin.recorrentes) return out;
    const ate = mesKey(ateDia || hoje());
    for (const r of cfgFin.recorrentes) {
      if (r.ativo === false || !r.inicio) continue;
      for (let mk = r.inicio; mk <= ate; mk = addMes(mk, 1)) {
        if (st.recKeys.has(r.id + '|' + mk)) continue;
        // competência = mês de referência; vencimento no dia escolhido do mesmo mês ou do mês seguinte (DAS: dia 20 do mês seguinte)
        const mv = r.vencMesSeguinte ? addMes(mk, 1) : mk;
        const ult = fimMes(mv + '-01');
        const venc = mv + '-' + String(Math.min(+r.dia || 20, +ult.slice(8))).padStart(2, '0');
        const cat = (cfgFin.categorias || []).find(c => c.id === r.categoriaId);
        out.push({
          ref: 'rec:' + r.id + ':' + mk, virtual: true, recorrenteId: r.id, mesRef: mk, origem: 'manual', grupo: cat ? cat.grupo : 'tributo',
          natureza: 'despesa', categoriaId: r.categoriaId, categoria: cat ? cat.nome : r.descricao, descricao: r.descricao + ' · ' + UU.mesNome(mk),
          valor: ok(r.valor) ? +r.valor : null, competencia: mk + '-01', vencimento: venc, conta: r.conta || null, status: 'previsto',
        });
      }
    }
    return out;
  }

  /** Fluxo de caixa (regime de caixa): só o que entrou e saiu de fato, por conta. */
  function movimentosCaixa(st, cfgFin) {
    const contas = (cfgFin && cfgFin.contas) || [];
    const base = Object.fromEntries(contas.map(c => [c.id, c.dataSaldo || '0000-00-00']));
    const out = [];
    const push = (o) => { if (o.conta && base[o.conta] && o.data < base[o.conta]) return; out.push(o); };
    for (const t of st.titulos.values()) {
      if (!t.realizadoEm || !ok(t.valorRealizado)) continue;
      const s = t.natureza === 'receita' ? 1 : -1;
      push({ data: t.realizadoEm, conta: t.conta, valor: r2(s * t.valorRealizado), descricao: t.descricao, grupo: t.grupo, ref: t.ref });
      if (t.estornadoEm) push({ data: t.estornadoEm, conta: t.conta, valor: r2(-s * t.valorRealizado), descricao: 'Estorno · ' + t.descricao, grupo: t.grupo, ref: t.ref, estorno: true });
    }
    for (const x of st.transf) {
      push({ data: x.data, conta: x.de, valor: -x.valor, descricao: 'Transferência para ' + nomeConta(cfgFin, x.para) + (x.descricao ? ' · ' + x.descricao : ''), grupo: 'transferencia', ref: 'transf:' + x.id });
      push({ data: x.data, conta: x.para, valor: +x.valor, descricao: 'Transferência de ' + nomeConta(cfgFin, x.de) + (x.descricao ? ' · ' + x.descricao : ''), grupo: 'transferencia', ref: 'transf:' + x.id });
    }
    out.sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
    return out;
  }
  const nomeConta = (cfgFin, id) => ((cfgFin && cfgFin.contas) || []).find(c => c.id === id)?.nome || id || '—';

  function caixa(st, cfgFin, p) {
    const contas = ((cfgFin && cfgFin.contas) || []).map(c => ({ id: c.id, nome: c.nome, ini: +c.saldoInicial || 0, ent: 0, sai: 0, fim: 0, atual: +c.saldoInicial || 0 }));
    const idx = Object.fromEntries(contas.map(c => [c.id, c]));
    const movs = movimentosCaixa(st, cfgFin);
    const noPeriodo = [];
    const porDia = {};
    for (const m of movs) {
      const c = idx[m.conta]; if (!c) continue;
      c.atual = r2(c.atual + m.valor);
      if (m.data < p.ini) c.ini = r2(c.ini + m.valor);
      else if (m.data <= p.fim) {
        if (m.valor >= 0) c.ent = r2(c.ent + m.valor); else c.sai = r2(c.sai - m.valor);
        noPeriodo.push(m);
        const d = porDia[m.data] || (porDia[m.data] = { ent: 0, sai: 0 });
        if (m.valor >= 0) d.ent = r2(d.ent + m.valor); else d.sai = r2(d.sai - m.valor);
      }
    }
    contas.forEach(c => { c.fim = r2(c.ini + c.ent - c.sai); });
    const tot = k => r2(contas.reduce((a, c) => a + c[k], 0));
    return { contas, movs: noPeriodo, porDia, ini: tot('ini'), ent: tot('ent'), sai: tot('sai'), fim: tot('fim'), atual: tot('atual') };
  }

  function receber(st) {
    return [...st.titulos.values()].filter(t => t.natureza === 'receita' && t.status === 'previsto')
      .sort((a, b) => (a.vencimento || '9999') < (b.vencimento || '9999') ? -1 : 1);
  }
  function pagar(st, cfgFin, ateDia) {
    const reais = [...st.titulos.values()].filter(t => t.natureza === 'despesa' && t.status === 'previsto' && t.grupo !== 'taxas');
    return reais.concat(recorrentesVirtuais(st, cfgFin, ateDia)).sort((a, b) => (a.vencimento || '9999') < (b.vencimento || '9999') ? -1 : 1);
  }

  function situacaoInsumo(saldo, minimo, fator) {
    const m = ok(minimo) ? +minimo : 0;
    if (saldo < 0) return { k: 'neg', label: 'Negativo · conferir', cor: 'r' };
    if (saldo === 0) return { k: 'zero', label: 'Zerado', cor: 'r' };
    if (m > 0 && saldo < m) return { k: 'baixo', label: 'Abaixo do mínimo', cor: 'o' };
    if (m > 0 && saldo <= m * (fator || 1.5)) return { k: 'proximo', label: 'Próximo do mínimo', cor: 'y' };
    return { k: 'ok', label: 'Adequado', cor: 'g' };
  }

  function estoqueLista(st, insumos, fator) {
    return Object.values(insumos).filter(i => i.ativo !== false).map(i => {
      const e = st.est[i.id] || { saldo: 0, cm: null };
      const c = custoInsumo(st, i);
      return Object.assign({}, i, { saldo: e.saldo, cm: c.v, cmOrigem: c.origem, valorEstoque: c.v == null || e.saldo <= 0 ? null : r2(e.saldo * c.v), sit: situacaoInsumo(e.saldo, i.minimo, fator) });
    }).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  }

  /* ------------------------------------------------------------------
     FORMAÇÃO DE PREÇO, RATEIO E PONTO DE EQUILÍBRIO
     ------------------------------------------------------------------ */
  function mediaCategoria(st, catId, hojeK) {
    // média mensal dos 3 últimos meses completos de lançamentos daquela categoria
    const m0 = mesKey(hojeK);
    let soma = 0, meses = 0;
    for (let i = 1; i <= 3; i++) {
      const mk = addMes(m0, -i);
      const p = { ini: mk + '-01', fim: fimMes(mk + '-01') };
      let s = 0, achou = false;
      for (const t of st.titulos.values()) if (t.categoriaId === catId && t.origem === 'manual' && dentro(t.competencia, p) && (t.status === 'realizado' || t.status === 'previsto')) { const v = ok(t.valorRealizado) ? t.valorRealizado : t.valor; if (ok(v)) { s += v; achou = true; } }
      if (achou) { soma += s; meses++; }
    }
    return meses ? soma / meses : null;
  }

  function analiseCustos({ st, produtos, insumos, custeio, cfgPag, hojeK }) {
    custeio = custeio || {};
    hojeK = hojeK || hoje();
    const p30 = { ini: addDias(hojeK, -29), fim: hojeK };
    const rv = resumoVendas(st, p30);
    const ativos = Object.values(produtos).filter(p => p.ativo !== false).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    const estimado = custeio.baseVolume === 'estimado';
    const vol = p => estimado ? (ok(p.volumeEstimado) ? +p.volumeEstimado : 0) : (rv.porProd[p.id] ? rv.porProd[p.id].qtd : 0);
    const avisos = [];

    // taxa média da maquininha (% sobre o preço)
    const pctForma = f => f === 'dinheiro' ? 0 : (cfgPag && cfgPag[f] && ok(cfgPag[f].taxa) ? +cfgPag[f].taxa / 100 : null);
    let taxaPct = null, taxaOrigem = '';
    const ref = custeio.formaReferencia || 'mix';
    if (ref !== 'mix') { taxaPct = pctForma(ref); taxaOrigem = FORMAS[ref]; }
    else if (rv.fat > 0) {
      let s = 0, falta = false;
      for (const f in rv.porForma) { const q = pctForma(f); if (q == null) falta = true; else s += q * rv.porForma[f]; }
      taxaPct = falta ? null : s / rv.fat; taxaOrigem = 'média das formas de pagamento dos últimos 30 dias';
    } else { taxaPct = pctForma('credito'); taxaOrigem = 'sem vendas recentes: taxa do crédito (cenário mais caro)'; }
    if (taxaPct == null) avisos.push('Taxas da SumUp não configuradas: os custos variáveis não incluem a taxa da maquininha.');

    // custos indiretos mensais
    const indiretos = (custeio.indiretos || []).map(ci => {
      let valor = ok(ci.valorMensal) ? +ci.valorMensal : null, origem = 'informado';
      if (valor == null && ci.categoriaId) { valor = mediaCategoria(st, ci.categoriaId, hojeK); origem = valor == null ? 'sem dados' : 'média dos 3 últimos meses'; }
      return Object.assign({}, ci, { valor, origem });
    });
    const ciTotal = r2(indiretos.reduce((a, c) => a + (c.valor || 0), 0));
    const moMensal = ok(custeio.moMensal) ? +custeio.moMensal : 0;
    const custoHora = ok(custeio.moMensal) && ok(custeio.horasMensais) && +custeio.horasMensais > 0 ? custeio.moMensal / custeio.horasMensais : null;
    const fatBase = estimado ? ativos.reduce((a, p) => a + vol(p) * (+p.preco || 0), 0) : rv.fat;

    // pesos de rateio por critério
    const pesos = {
      unidades: p => vol(p), faturamento: p => vol(p) * (+p.preco || 0), minutos: p => vol(p) * (+p.minutosPreparo || 0),
      energia: p => vol(p) * (+p.fatorEnergia || 0), igual: p => vol(p) > 0 ? 1 : 0,
    };
    const somaPeso = {};
    for (const k in pesos) somaPeso[k] = ativos.reduce((a, p) => a + pesos[k](p), 0);

    const lucroPct = ok(custeio.lucroDesejado) ? +custeio.lucroDesejado / 100 : 0;
    const pctFixo = fatBase > 0 ? (ciTotal + moMensal) / fatBase : null;
    const den = 1 - (taxaPct || 0) - (pctFixo || 0) - lucroPct;
    // sem despesas fixas nem lucro desejado informados, não há markup a sugerir (seria só o custo)
    const markupSug = pctFixo != null && den > 0 && (ciTotal + moMensal > 0 || lucroPct > 0) ? 1 / den : null;

    const linhas = ativos.map(p => {
      const combos = (p.combos || []).filter(c => c.ativo !== false);
      const cd = custoDireto(st, p, combos[0] ? combos[0].id : null, insumos);
      const preco = +p.preco || 0;
      const v = vol(p);
      const taxaV = taxaPct == null ? 0 : preco * taxaPct;
      const cv = cd.total + taxaV;
      const mcU = preco - cv;
      const mo = custoHora == null ? 0 : (+p.minutosPreparo || 0) * custoHora / 60;
      let ci = 0, ciOk = true;
      for (const c of indiretos) {
        if (!c.valor) continue;
        const crit = pesos[c.criterio] ? c.criterio : 'unidades';
        const sp = somaPeso[crit];
        if (!(sp > 0) || !(v > 0)) { ciOk = false; continue; }
        ci += c.valor * pesos[crit](p) / sp / v;
      }
      const ct = cv + mo + ci;
      const inc = cd.vazia || cd.pendentes.length > 0; // custo incompleto: não mostra margens que pareceriam reais
      return {
        id: p.id, nome: p.nome, categoria: p.categoria, preco, vol: v, combo: combos[0] ? combos[0].nome : null, nCombos: combos.length,
        mp: cd.mp, acomp: cd.acomp, emb: cd.emb, cd: cd.total, pendentes: cd.pendentes, fichaVazia: cd.vazia, itens: cd.itens,
        taxaV, cv, mcU: inc ? null : mcU, mcPct: inc || !preco ? null : mcU / preco, mo, ci, ciOk, ct: inc ? null : ct, incompleto: inc,
        margem: inc || !preco ? null : (preco - ct) / preco,
        markup: !inc && cd.total > 0 ? preco / cd.total : null, sugerido: markupSug && !inc && cd.total > 0 ? cd.total * markupSug : null,
      };
    });
    // MC média ponderada pelo volume
    let mcSum = 0, fatSum = 0;
    linhas.forEach(l => { if (l.vol > 0 && !l.incompleto) { mcSum += l.mcU * l.vol; fatSum += l.preco * l.vol; } });
    const mcMedia = fatSum > 0 ? mcSum / fatSum : null;
    const fixos = r2(ciTotal + moMensal);
    const pe = fixos > 0 && mcMedia && mcMedia > 0 ? fixos / mcMedia : null;
    return { linhas, indiretos, ciTotal, moMensal, custoHora, fatBase, pctFixo, taxaPct, taxaOrigem, lucroPct, markupSug, mcMedia, fixos, pe, avisos, estimado };
  }

  /** Simula um novo preço para um produto. */
  function simular(linha, novoPreco, taxaPct) {
    if (linha.incompleto) return null;
    const preco = +novoPreco;
    const taxaV = taxaPct == null ? 0 : preco * taxaPct;
    const cv = linha.cd + taxaV, mcU = preco - cv, ct = cv + linha.mo + linha.ci;
    return { preco, cv, mcU, mcPct: preco ? mcU / preco : null, ct, margem: preco ? (preco - ct) / preco : null, impactoMensal: (mcU - linha.mcU) * linha.vol };
  }

  return {
    FORMAS, CLASSES, UNIDADES, TIPOS_MOV, GRUPOS, DESP_OPER, CLASSE_POR_CATEGORIA, Erro, numLabel,
    fold, custoInsumo, fichaEfetiva, custoDireto, classeDe, montarVenda, montarConciliacao, prevista,
    resumoVendas, taxasPeriodo, lancamentosPeriodo, perdasPeriodo, dre, recorrentesVirtuais, movimentosCaixa, caixa, nomeConta,
    receber, pagar, situacaoInsumo, estoqueLista, analiseCustos, simular,
  };
})();


/* =====================================================================
   DADOS · banco compartilhado do artefato (db), usuários e sincronização
   ---------------------------------------------------------------------
   Estrutura no banco:
     config/geral · config/pagamentos · config/financeiro · config/custeio · config/usuarios
     produtos/<id> · insumos/<id> · fornecedores/<id>        (cadastros versionados)
     membros/<uid>                                           (cada pessoa escreve só o seu)
     diarios/<uid>/sessoes/<sessão>                          (diário de operações de cada pessoa;
                                                              só o autor grava — histórico imutável)
     sistema/contador-vendas                                 (numeração única com trava)
   ===================================================================== */
const S = {
  modo: 'carregando', erro: '', db: null, user: null, downloads: null,
  me: null, uid: null, papel: null, usuario: null, dono: false,
  produtos: {}, insumos: {}, fornecedores: {}, membros: {},
  cfg: { geral: null, pagamentos: null, financeiro: null, custeio: null, usuarios: null },
  carregado: {}, diarios: new Map(), local: null, st: D.fold([]),
  pendentes: 0, ultimoErroEnvio: '', online: true, desatualizado: false,
};

const PAPEIS = { proprietaria: 'Proprietária', gerente: 'Gerente', atendente: 'Atendente' };
const PERM = {
  proprietaria: ['*'],
  gerente: ['vender', 'vendas_todas', 'cancelar', 'estoque_ver', 'estoque_mov', 'perda', 'custos_ver', 'produtos_editar', 'financeiro', 'relatorios', 'config', 'backup'],
  atendente: ['vender', 'estoque_ver', 'perda'],
};
const pode = a => !!S.papel && (PERM[S.papel].includes('*') || PERM[S.papel].includes(a));

/* ---------- valores padrão de estrutura (não são registros do negócio) ---------- */
const PADRAO = {
  geral: () => ({
    loja: { nome: 'Açaí da Mãe', endereco: '', instagram: '', slogan: 'Gostoso como colo de mãe!' },
    metaDiaria: null, fatorProximo: 1.5, implantacao: U.hoje(),
    categoriasProduto: ['Açaí', 'Cremes', 'Combos'],
    categoriasInsumo: ['Insumos', 'Polpas', 'Cremes', 'Frutas', 'Complementos', 'Embalagens', 'Copos', 'Outros materiais'],
  }),
  pagamentos: () => ({

    dinheiro: { conta: 'caixa' },
    pix: { conta: 'sumup', taxa: null, taxaFixa: null, prazo: null, tipoPrazo: 'corridos' },
    debito: { conta: 'sumup', taxa: null, taxaFixa: null, prazo: null, tipoPrazo: 'corridos' },
    credito: { conta: 'sumup', taxa: null, taxaFixa: null, prazo: null, tipoPrazo: 'corridos' },
  }),
  financeiro: () => ({
    contas: [
      { id: 'caixa', nome: 'Caixa (dinheiro)', saldoInicial: 0, dataSaldo: U.hoje() },
      { id: 'sumup', nome: 'Conta SumUp', saldoInicial: 0, dataSaldo: U.hoje() },
      { id: 'banco', nome: 'Conta bancária', saldoInicial: 0, dataSaldo: U.hoje() },
    ],
    saldoInformado: false, categorias: [], recorrentes: [],
  }),
  custeio: () => ({ baseVolume: 'ultimos30', formaReferencia: 'mix', lucroDesejado: null, moMensal: null, horasMensais: null, indiretos: [] }),
  usuarios: () => ({ lista: [] }),
};
const cfg = k => S.cfg[k] || PADRAO[k]();

const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* armazenamento local indisponível: segue só em memória */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } },
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const comPrazo = (p, ms, msg) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout', message: msg || 'tempo esgotado' }), ms))]);

const Store = (() => {
  let recalcTimer = null, retryTimer = null, cadeia = Promise.resolve();
  const subs = new Map();
  let aoMudar = () => { };

  let sujo = false;
  function calcularAgora() {
    const todos = [];
    for (const evs of S.diarios.values()) for (const e of evs) todos.push(e);
    if (S.local) for (const e of S.local.eventos) todos.push(e);
    S.st = D.fold(todos);
    S.pendentes = S.local ? S.local.eventos.length - S.local.confirmados : 0;
    sujo = false;
  }
  /** Estado garantidamente atualizado (usado antes de registrar uma venda, para o custo e o estoque saírem certos). */
  function atual() { if (sujo) { clearTimeout(recalcTimer); calcularAgora(); aoMudar('dados'); } return S.st; }
  function recalcular() {
    sujo = true;
    clearTimeout(recalcTimer);
    recalcTimer = setTimeout(() => { calcularAgora(); aoMudar('dados'); }, 60);
  }

  function assinar(chave, ref, fn) {
    if (subs.has(chave)) return;
    const timer = setTimeout(() => { S.desatualizado = true; aoMudar('conexao'); }, 10000);
    const un = ref.onSnapshot(snap => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); if (S.desatualizado) { S.desatualizado = false; aoMudar('conexao'); } }
      fn(snap);
    }, err => {
      clearTimeout(timer);
      subs.delete(chave);
      if (err.code === 'revoked') { S.modo = 'sem-acesso'; S.erro = 'O acesso a este sistema foi alterado.'; aoMudar('modo'); return; }
      S.desatualizado = true; aoMudar('conexao');
      if (err.code === 'unavailable') setTimeout(() => assinar(chave, ref, fn), 5000);
    });
    subs.set(chave, un);
  }

  const local = () => typeof MODO_LOCAL !== 'undefined' && MODO_LOCAL;
  const chaveSessao = 'acai:usuario';
  async function iniciar(cb) {
    aoMudar = cb;
    if (local()) {
      await LocalDB.abrir();
      S.db = LocalDB.api; S.downloads = DownloadLocal;
      await semearSeVazio();
      const k = (() => { try { return sessionStorage.getItem(chaveSessao) || localStorage.getItem(chaveSessao); } catch (e) { return null; } })();
      const u = k && ((LocalDB.ler('config/usuarios') || {}).lista || []).find(x => x.key === k && x.ativo !== false);
      if (u) return entrarComo(u);
      S.modo = 'login'; return aoMudar('modo');
    }
    const [db, user, downloads] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);
    S.db = db; S.user = user; S.downloads = downloads;
    if (!db || !user) { S.modo = 'sem-banco'; return aoMudar('modo'); }
    S.me = await user.me();
    S.uid = S.me.id; S.dono = !!S.me.isOwner;
    if (!S.uid) { S.modo = 'sem-identidade'; return aoMudar('modo'); }
    if ((await user.can('data.write')) === false) { S.modo = 'somente-leitura'; return aoMudar('modo'); }
    conectar();
  }

  /* ---------- login local (versão para download) ---------- */
  let falhas = 0, bloqueadoAte = 0;
  function login(email, senha, lembrar) {
    if (Date.now() < bloqueadoAte) throw new D.Erro('Muitas tentativas. Aguarde ' + Math.ceil((bloqueadoAte - Date.now()) / 1000) + ' segundos.');
    const lista = (LocalDB.ler('config/usuarios') || {}).lista || [];
    const u = lista.find(x => (x.email || '').toLowerCase() === String(email || '').trim().toLowerCase());
    if (!u || u.ativo === false || !Senha.confere(u, senha)) {
      if (++falhas >= 5) { bloqueadoAte = Date.now() + 30000; falhas = 0; }
      throw new D.Erro('E-mail ou senha incorretos.');
    }
    falhas = 0;
    try { (lembrar ? localStorage : sessionStorage).setItem(chaveSessao, u.key); } catch (e) { }
    entrarComo(u);
  }
  async function sair() {
    try { await comPrazo(enviar(), 5000); } catch (e) { /* o que não gravou fica na fila do aparelho e é reenviado no próximo login */ }
    try { sessionStorage.removeItem(chaveSessao); localStorage.removeItem(chaveSessao); } catch (e) { }
    location.reload();
  }
  function entrarComo(u) {
    S.me = { id: 'u-' + u.key, email: u.email, name: u.nome, isOwner: false };
    S.uid = S.me.id; S.dono = false;
    S.modo = 'carregando'; aoMudar('modo');
    conectar();
  }
  /** Troca a senha de um usuário (a própria ou, para a proprietária, a redefinição para a senha padrão). */
  async function definirSenha(key, senhaNova, { atual, padrao } = {}) {
    const c = JSON.parse(JSON.stringify(cfg('usuarios')));
    const u = (c.lista || []).find(x => x.key === key);
    if (!u) throw new D.Erro('Usuário não encontrado.');
    if (atual != null && !Senha.confere(u, atual)) throw new D.Erro('A senha atual não confere.');
    Senha.definir(u, senhaNova, !!padrao);
    await salvarDoc('config/usuarios', c, { versao: (S.cfg.usuarios && S.cfg.usuarios.versao) || null, entidade: 'configuração', nome: padrao ? 'Senha redefinida: ' + u.nome : 'Troca de senha: ' + u.nome });
  }

  function conectar() {
    const db = S.db;
    iniciarSessaoLocal();

    for (const k of Object.keys(S.cfg)) assinar('cfg:' + k, db.doc('config/' + k), snap => {
      S.cfg[k] = snap.exists ? snap.data() : null; S.carregado[k] = S.carregado[k] || !snap.metadata.fromCache;
      if (k === 'usuarios') resolverPapel();
      recalcular(); aoMudar('cfg');
    });
    for (const col of ['produtos', 'insumos', 'fornecedores']) assinar('col:' + col, db.collection(col), snap => {
      const o = {}; snap.docs.forEach(d => { o[d.id] = Object.assign({ id: d.id }, d.data()); });
      S[col] = o; S.carregado[col] = S.carregado[col] || !snap.metadata.fromCache; recalcular();
    });
    assinar('col:membros', db.collection('membros'), snap => {
      const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); }); S.membros = o;
      Object.keys(o).concat([S.uid]).forEach(assinarDiario);
      resolverPapel(); aoMudar('cfg');
    });
    assinarDiario(S.uid);
    window.addEventListener('online', () => enviar());
  }

  function assinarDiario(uid) {
    assinar('diario:' + uid, S.db.collection('diarios/' + uid + '/sessoes'), snap => {
      for (const d of snap.docs) S.diarios.set(uid + '/' + d.id, (d.data().eventos || []));
      recalcular();
    });
  }

  function resolverPapel() {
    const lista = (S.cfg.usuarios && S.cfg.usuarios.lista) || [];
    const email = (S.me.email || '').toLowerCase();
    let u = email ? lista.find(x => (x.email || '').toLowerCase() === email) : null;
    const m = S.membros[S.uid];
    if (!u && m && m.vinculo) { const c = lista.find(x => x.key === m.vinculo); if (c && c.codigo && m.codigo === c.codigo) u = c; }
    const antes = S.papel;
    if (u && u.ativo !== false) { S.usuario = u; S.papel = u.papel; }
    else if (S.dono) { S.usuario = { key: 'dono', nome: S.me.name || 'Administrador', papel: 'proprietaria', dono: true }; S.papel = 'proprietaria'; }
    else { S.usuario = null; S.papel = null; }
    if (S.papel) {
      if (S.modo === 'carregando' || S.modo === 'sem-vinculo') { S.modo = 'app'; aoMudar('modo'); }
      registrarMembro();
    } else if (S.carregado.usuarios || S.cfg.usuarios) { S.modo = 'sem-vinculo'; aoMudar('modo'); }
    if (antes !== S.papel) aoMudar('modo');
  }

  let membroGravado = false;
  async function registrarMembro(codigo) {
    if (membroGravado && !codigo) return;
    membroGravado = true;
    const atual = S.membros[S.uid] || {};
    const corpo = { vinculo: S.usuario ? S.usuario.key : (codigo ? codigo.key : null), codigo: codigo ? codigo.codigo : (atual.codigo || null), desde: atual.desde || U.agora(), ultimoAcesso: U.agora() };
    try { await S.db.doc('membros/' + S.uid).set(corpo); } catch (e) { membroGravado = false; if (codigo) throw e; }
  }

  async function vincularPorCodigo(codigoDigitado) {
    const lista = (S.cfg.usuarios && S.cfg.usuarios.lista) || [];
    const c = lista.find(x => x.ativo !== false && x.codigo && x.codigo.toUpperCase() === String(codigoDigitado || '').trim().toUpperCase());
    if (!c) throw new D.Erro('Código não encontrado. Confira com a proprietária.');
    await registrarMembro({ key: c.key, codigo: c.codigo });
    S.membros[S.uid] = Object.assign({}, S.membros[S.uid], { vinculo: c.key, codigo: c.codigo });
    resolverPapel();
  }

  /* ---------- diário local (fila de envio que sobrevive a falta de internet) ---------- */
  const chaveLocal = () => 'acai:sessao:' + S.uid;
  function iniciarSessaoLocal() {
    const salvo = LS.get(chaveLocal());
    S.local = { sid: U.agora().slice(0, 10) + '_' + U.sid(), criadoEm: U.agora(), eventos: [], confirmados: 0 };
    if (salvo && salvo.eventos && salvo.confirmados < salvo.eventos.length) {
      // eventos que não chegaram ao banco na última vez: vão para uma sessão nova (não sobrescreve a antiga)
      S.local.eventos = salvo.eventos.slice(salvo.confirmados);
      setTimeout(enviar, 500);
    }
    salvarLocal();
  }
  const salvarLocal = () => LS.set(chaveLocal(), S.local);

  /** Grava uma operação. Resolve 'ok' quando o banco confirmou, ou 'pendente' se ficou na fila deste aparelho. */
  function gravar(ev) {
    ev.id = ev.id || U.uid();
    ev.em = ev.em || U.agora();
    ev.por = S.uid;
    S.local.eventos.push(ev);
    salvarLocal(); recalcular();
    return enviar();
  }

  function enviar() {
    cadeia = cadeia.then(enviarAgora, enviarAgora);
    return cadeia;
  }

  async function enviarAgora() {
    const L = S.local;
    if (!L || L.confirmados >= L.eventos.length) return 'ok';
    clearTimeout(retryTimer);
    try {
      const semNumero = L.eventos.filter(e => e.tipo === 'venda' && e.numero == null);
      if (semNumero.length) await numerar(semNumero);
      const corpo = { uid: S.uid, sid: L.sid, criadoEm: L.criadoEm, atualizadoEm: U.agora(), eventos: L.eventos };
      await comPrazo(S.db.doc('diarios/' + S.uid + '/sessoes/' + L.sid).set(corpo), 20000, 'sem resposta do banco');
      L.confirmados = L.eventos.length;
      S.ultimoErroEnvio = ''; S.online = true;
      if (JSON.stringify(corpo).length > 150000) S.local = { sid: U.agora().slice(0, 10) + '_' + U.sid(), criadoEm: U.agora(), eventos: [], confirmados: 0 };
      salvarLocal(); recalcular();
      return 'ok';
    } catch (e) {
      S.online = false; S.ultimoErroEnvio = (e && e.message) || 'falha de conexão';
      if (e && e.code === 'quota_exceeded') S.ultimoErroEnvio = 'O banco atingiu o limite de armazenamento. Exporte um backup e fale com o responsável técnico.';
      salvarLocal(); recalcular();
      retryTimer = setTimeout(enviar, 15000);
      return 'pendente';
    }
  }

  /** Numeração única entre aparelhos: trava curta no contador + maior número já visto. */
  async function numerar(vendas) {
    const ref = S.db.doc('sistema/contador-vendas');
    // a trava não tem liberação: expira sozinha. Por isso é curta (2,5 s) e a espera total cobre algumas expirações.
    for (let i = 0; i < 30; i++) {
      const r = await comPrazo(ref.acquire({ holder: S.local.sid, ttlMs: 2500 }), 10000, 'sem resposta do contador');
      if (r.acquired) {
        const snap = await comPrazo(ref.get(), 10000);
        let n = Math.max(snap.exists ? (+snap.data().n || 0) : 0, S.st.ultimaVenda || 0);
        for (const v of vendas) v.numero = ++n;
        await comPrazo(ref.set({ n, atualizadoEm: U.agora() }), 10000);
        salvarLocal();
        return;
      }
      await sleep(150 + Math.random() * 350);
    }
    throw { code: 'ocupado', message: 'contador de vendas ocupado' };
  }

  /* ---------- cadastros versionados, com trava e auditoria ---------- */
  const IGNORAR = new Set(['versao', 'atualizadoEm', 'atualizadoPor', 'criadoEm', 'criadoPor', 'id']);
  const limpar = o => JSON.parse(JSON.stringify(o || {}, (k, v) => (k === 'senhaHash' || k === 'sal' || k === 'codigo') ? undefined : v));
  const curto = v => { const s = typeof v === 'string' ? v : JSON.stringify(v); return s == null ? '' : (s.length > 140 ? s.slice(0, 137) + '…' : s); };
  function diferencas(a, b) {
    const out = [];
    const ks = new Set(Object.keys(a || {}).concat(Object.keys(b || {})));
    for (const k of ks) { if (IGNORAR.has(k)) continue; const x = JSON.stringify((a || {})[k]), y = JSON.stringify((b || {})[k]); if (x !== y) out.push({ campo: k, antes: curto((a || {})[k]), depois: curto((b || {})[k]) }); }
    return out;
  }

  async function salvarDoc(path, dados, { versao, entidade, nome } = {}) {
    if (!S.db) throw new D.Erro('Banco indisponível.');
    const ref = S.db.doc(path);
    try {
      let lease = { acquired: false };
      for (let i = 0; i < 12 && !lease.acquired; i++) {
        lease = await comPrazo(ref.acquire({ holder: S.local.sid, ttlMs: 3000 }), 10000);
        if (!lease.acquired) await sleep(300 + Math.random() * 300);
      }
      if (!lease.acquired) throw new D.Erro('Outra pessoa está salvando este cadastro agora. Tente de novo em alguns segundos.');
      const snap = await comPrazo(ref.get(), 10000);
      const atual = snap.exists && Object.keys(snap.data()).length ? snap.data() : null;
      if (versao != null && atual && (atual.versao || 0) !== versao)
        throw new D.Erro('Este cadastro foi alterado por outra pessoa enquanto você editava. Feche e abra de novo para ver a versão atual.');
      const novo = Object.assign({}, dados, {
        versao: ((atual && atual.versao) || 0) + 1, atualizadoEm: U.agora(), atualizadoPor: S.uid,
        criadoEm: (atual && atual.criadoEm) || U.agora(), criadoPor: (atual && atual.criadoPor) || S.uid,
      });
      delete novo.id;
      await comPrazo(ref.set(novo), 15000);
      const dif = diferencas(limpar(atual), limpar(novo));
      if (dif.length) gravar({ tipo: 'auditoria', entidade: entidade || path.split('/')[0], entidadeId: path, nome: nome || dados.nome || path, acao: atual ? 'alteração' : 'criação', diferencas: dif.slice(0, 30) });
      return novo;
    } catch (e) {
      if (e instanceof D.Erro) throw e;
      throw new D.Erro(e && e.code === 'timeout' ? 'Sem conexão com o banco. Cadastros e configurações só podem ser alterados com internet.' : 'Não foi possível salvar: ' + ((e && e.message) || 'erro desconhecido'));
    }
  }

  return { iniciar, gravar, enviar, salvarDoc, vincularPorCodigo, recalcular, diferencas, atual, login, sair, definirSenha, local };
})();

/** Nome de quem fez uma operação (pelo vínculo do cadastro de usuários). */
function nomePor(uid) {
  if (!uid) return '—';
  if (uid === S.uid && S.usuario) return S.usuario.nome;
  const m = S.membros[uid];
  const lista = (S.cfg.usuarios && S.cfg.usuarios.lista) || [];
  if (m && m.vinculo) { const u = lista.find(x => x.key === m.vinculo); if (u) return u.nome; if (m.vinculo === 'dono') return 'Administrador'; }
  return 'Usuário';
}

/* =====================================================================
   INTERFACE · componentes reutilizáveis
   Todo texto vindo do usuário passa por h() (escape) antes de ir para a tela.

const h = U.esc;
const ICONES = {
  inicio: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  vendas: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3',

function Kpi({ label, valor, info, delta, inverso, sub, grande, cls = '' }) {
  let d = '';
  if (delta !== undefined) {
    if (delta == null) d = '';
    else { const bom = inverso ? delta <= 0 : delta >= 0; d = `<span class="d ${delta === 0 ? 'neutro' : bom ? 'up' : 'down'}">${delta > 0 ? '▲' : delta < 0 ? '▼' : '='} ${U.pct(Math.abs(delta))}</span>`; }
  }
  return `<div class="kpi ${cls}"><span class="lb">${h(label)} ${info ? Info(info) : ''}</span><span class="v ${grande ? 'g' : ''}">${valor}</span>${d}${sub ? `<small>${sub}</small>` : ''}</div>`;
}

/* ---------- gráfico de barras (SVG, escala única, toque mostra o valor) ---------- */
let grafSeq = 0;
function Barras(rotulos, valores, { fmt = v => U.num(v, 0), titulo = '', compara = null, alturas = 150 } = {}) {
  const id = 'g' + (++grafSeq);
  const n = valores.length;
  const max = Math.max(1, ...valores, ...(compara || []));
  const W = 640, H = alturas + 46, top = 18, base = top + alturas, esq = 6, dir = 6;
  const larg = (W - esq - dir) / Math.max(1, n);
  const bw = Math.max(3, Math.min(42, larg * (compara ? 0.36 : 0.62)));
  const mostraVal = n <= 12;
  const passoRot = n > 16 ? Math.ceil(n / 12) : 1;
  const iMax = valores.indexOf(Math.max(...valores));
  const linhas = [0.25, 0.5, 0.75, 1].map(f => `<line class="gl" x1="${esq}" x2="${W - dir}" y1="${base - f * alturas}" y2="${base - f * alturas}"/>`).join('');
  const barras = valores.map((v, i) => {
    const cx = esq + i * larg + larg / 2;
    const hh = v / max * alturas;
    const x = compara ? cx + 1 : cx - bw / 2;
    let s = '';
    if (compara) { const hc = (compara[i] || 0) / max * alturas; s += `<rect class="bx ant" x="${cx - bw - 1}" y="${base - hc}" width="${bw}" height="${Math.max(hc, 0)}" rx="3"><title>${h(rotulos[i])} · anterior: ${h(fmt(compara[i] || 0))}</title></rect>`; }
    s += `<rect class="bx ${i === iMax && v > 0 && !compara ? 'max' : ''}" x="${x}" y="${base - hh}" width="${bw}" height="${Math.max(hh, v > 0 ? 1 : 0)}" rx="4" data-a="barra" data-g="${id}" data-t="${h(rotulos[i] + ': ' + fmt(v) + (compara ? ' (anterior: ' + fmt(compara[i] || 0) + ')' : ''))}"><title>${h(rotulos[i])}: ${h(fmt(v))}</title></rect>`;
    if (mostraVal && v > 0 && !compara) s += `<text class="vl" x="${cx}" y="${base - hh - 5}" text-anchor="middle">${h(fmt(v))}</text>`;
    if (i % passoRot === 0) s += `<text x="${cx}" y="${base + 16}" text-anchor="middle">${h(rotulos[i])}</text>`;
    return s;
  }).join('');
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="${h(titulo)}">${linhas}${barras}<line class="gl" x1="${esq}" x2="${W - dir}" y1="${base}" y2="${base}"/></svg><div class="legenda-graf" id="${id}">Toque em uma barra para ver o valor.</div>`;
}

const CORES_FORMA = { dinheiro: 'var(--verde)', pix: 'var(--roxo)', debito: 'var(--laranja)', credito: 'var(--vinho)' };
function Rosca(porForma) {
  const tot = Object.values(porForma).reduce((a, b) => a + b, 0);
  if (!tot) return `<p class="muted">Sem vendas no período.</p>`;
  let a = 0;
  const fat = Object.keys(D.FORMAS).filter(k => porForma[k]).map(k => { const p = porForma[k] / tot * 100; const s = `${CORES_FORMA[k]} ${a}% ${a + p}%`; a += p; return s; }).join(',');
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="donut" style="background:conic-gradient(${fat})" role="img" aria-label="Divisão por forma de pagamento"></div><div class="lista" style="flex:1;min-width:180px">${Object.keys(D.FORMAS).filter(k => porForma[k]).map(k => `<div class="row" style="padding:6px 0"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${CORES_FORMA[k]};margin-right:6px"></i>${D.FORMAS[k]}</span><span class="num"><b>${brl(porForma[k])}</b> <small>${U.pct(porForma[k] / tot, 0)}</small></span></div>`).join('')}</div></div>`;
}

function Tabela(cols, linhas, { rodape, clique, vazio = 'Nada para mostrar neste período.' } = {}) {
  if (!linhas.length) return `<div class="vazio">${I('info')}<span>${h(vazio)}</span></div>`;
  const th = cols.map(c => `<th class="${c.n ? 'n' : ''}">${h(c.t)}</th>`).join('');
  const tr = linhas.map((l, i) => `<tr ${clique ? `class="clk" data-a="${clique.a}" data-v="${h(clique.v(i))}"` : ''}>${cols.map((c, j) => `<td class="${c.n ? 'n' : ''}">${c.html ? l[j] : h(l[j])}</td>`).join('')}</tr>`).join('');
  const tf = rodape ? `<tfoot><tr>${rodape.map((v, j) => `<td class="${cols[j] && cols[j].n ? 'n' : ''}">${h(v)}</td>`).join('')}</tr></tfoot>` : '';
  return `<div class="tab-wrap"><table class="t"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody>${tf}</table></div>`;
}

/* ---------- folhas (janelas), confirmação e avisos ---------- */
const Folha = (() => {
  const pilha = [];
  const raiz = () => document.getElementById('folhas');
  function abrir({ titulo, corpo, largo, id, aoFechar }) {
    const el = document.createElement('div');
    el.className = 'veu';
    el.innerHTML = `<div class="folha ${largo ? 'largo' : ''}" role="dialog" aria-modal="true" aria-label="${h(titulo)}"><div class="folha-cab"><b>${h(titulo)}</b><button type="button" class="x" data-a="fechar" aria-label="Fechar">${I('x')}</button></div><div class="corpo">${corpo}</div></div>`;
    el.addEventListener('mousedown', e => { if (e.target === el) fechar(); });
    raiz().appendChild(el);
    pilha.push({ el, id, aoFechar });
    const f = el.querySelector('input.in,select.in,textarea.in');
    if (f && window.matchMedia('(min-width:700px)').matches) setTimeout(() => f.focus(), 30);
    return el;
  }
  function fechar() { const t = pilha.pop(); if (!t) return; t.el.remove(); t.aoFechar && t.aoFechar(); }
  function fecharTodas() { while (pilha.length) fechar(); }
  const topo = () => pilha.length ? pilha[pilha.length - 1] : null;
  function corpo(html) { const t = topo(); if (t) t.el.querySelector('.corpo').innerHTML = html; }
  return { abrir, fechar, fecharTodas, topo, corpo, aberta: id => pilha.some(p => p.id === id) };
})();

function Confirmar({ titulo, texto, botao = 'Confirmar', perigo, extra = '' }) {
  return new Promise(res => {
    let decidido = false;
    const el = Folha.abrir({
      titulo, aoFechar: () => { if (!decidido) res(null); },
      corpo: `<form class="form" data-f="confirmar"><p>${texto}</p>${extra}<div class="erro-form"></div><div class="acoes"><button type="button" class="btn sec" data-a="fechar">Voltar</button><button type="submit" class="btn ${perigo ? 'perigo' : ''}">${h(botao)}</button></div></form>`,
    });
    el.querySelector('form').addEventListener('submit', e => {
      e.preventDefault(); e.stopPropagation();
      const dados = Object.fromEntries(new FormData(e.target));
      decidido = true; Folha.fechar(); res(dados);
    });
  });
}

function Toast(msg, tipo = '') {
  const r = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + tipo; el.setAttribute('role', 'status'); el.textContent = msg;
  r.appendChild(el);
  setTimeout(() => el.remove(), tipo === 'err' ? 5200 : 3200);
}

/** Executa uma ação de botão de envio: desativa o botão (evita toque duplo) e mostra o erro no formulário. */
async function Enviar(form, fn) {
  const btn = form.querySelector('button[type=submit]');
  const erro = form.querySelector('.erro-form');
  if (btn && btn.disabled) return;
  if (btn) { btn.disabled = true; btn.dataset.txt = btn.textContent; btn.textContent = 'Salvando…'; }
  if (erro) erro.textContent = '';
  try { await fn(); delete form.dataset.sujo; }
  catch (e) {
    const msg = e instanceof D.Erro ? e.message : 'Erro inesperado: ' + ((e && e.message) || e);
    if (erro) { erro.textContent = msg; erro.scrollIntoView({ block: 'nearest' }); } else Toast(msg, 'err');
    if (!(e instanceof D.Erro)) console.error(e);
  } finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = btn.dataset.txt; } }
}

function alertas() {
  const out = [];

  const fator = cfg('geral').fatorProximo || 1.5;
  const lista = D.estoqueLista(S.st, S.insumos, fator);
  const un = i => ' ' + i.unidade;
  lista.filter(i => i.sit.k === 'neg').forEach(i => out.push({ c: 'r', t: `<b>${h(i.nome)}</b> está com saldo negativo (${U.num(i.saldo)}${un(i)}). Confira o estoque físico e registre a compra ou o ajuste.`, a: 'insumo', v: i.id }));
  lista.filter(i => i.sit.k === 'zero').forEach(i => out.push({ c: 'r', t: `<b>${h(i.nome)}</b> está zerado.`, a: 'insumo', v: i.id }));
  lista.filter(i => i.sit.k === 'baixo').forEach(i => out.push({ c: 'o', t: `<b>${h(i.nome)}</b> abaixo do mínimo: ${U.num(i.saldo)}${un(i)} (mínimo ${U.num(i.minimo)}${un(i)}).`, a: 'insumo', v: i.id }));
  if (Store.local() && S.usuario && S.usuario.trocarSenha) out.unshift({ c: 'o', t: 'Você está usando a senha padrão. Troque por uma senha só sua.', a: 'trocarSenha' });
  if (S.pendentes > 0) out.unshift({ c: 'o', t: `<b>${S.pendentes} operação(ões)</b> deste aparelho aguardando envio ao banco${S.ultimoErroEnvio ? ' (' + h(S.ultimoErroEnvio) + ')' : ''}. Elas serão enviadas automaticamente quando a conexão voltar.` });
  if (pode('financeiro')) {
    const hj = U.hoje();
    const pg = D.pagar(S.st, cfg('financeiro'), hj);
    const venc = pg.filter(t => t.vencimento && t.vencimento < hj), hoje = pg.filter(t => t.vencimento && t.vencimento >= hj && t.vencimento <= U.addDias(hj, 3));
    if (venc.length) out.push({ c: 'r', t: `<b>${venc.length} conta(s) a pagar vencida(s)</b>: ${venc.slice(0, 3).map(t => h(t.descricao)).join(', ')}${venc.length > 3 ? '…' : ''}.`, a: 'irFin', v: 'pagar' });
    if (hoje.length) out.push({ c: 'o', t: `<b>${hoje.length} conta(s)</b> vencem nos próximos 3 dias.`, a: 'irFin', v: 'pagar' });
    const rec = D.receber(S.st).filter(t => t.vencimento && t.vencimento <= hj);
    if (rec.length) out.push({ c: 'p', t: `<b>${rec.length} recebimento(s) da SumUp</b> previstos até hoje (${brl(rec.reduce((a, t) => a + t.valor, 0))}). Confira o depósito e concilie.`, a: 'irFin', v: 'receber' });
    const pag = cfg('pagamentos');
    const faltaTaxa = ['pix', 'debito', 'credito'].filter(f => !U.ok(pag[f] && pag[f].taxa) || !U.ok(pag[f] && pag[f].prazo));
    if (faltaTaxa.length) out.push({ c: 'p', t: `Taxas e prazos da SumUp ainda não informados (${faltaTaxa.map(f => D.FORMAS[f]).join(', ')}). As vendas são registradas normalmente; a taxa será apurada na conciliação.`, a: 'irConfig', v: 'pagamentos' });
    if (!cfg('financeiro').saldoInformado) out.push({ c: 'p', t: 'Informe o saldo inicial do caixa, da conta SumUp e do banco para o fluxo de caixa ficar correto.', a: 'irConfig', v: 'financeiro' });
  }
  if (pode('produtos_editar')) {
    const prods = Object.values(S.produtos).filter(p => p.ativo !== false);
    const conf = prods.filter(p => !p.fichaConferida).length;
    if (conf) out.push({ c: 'p', t: `<b>${conf} ficha(s) técnica(s)</b> a conferir. As quantidades vieram do protótipo e ainda não incluem os complementos.`, a: 'ir', v: 'produtos' });
    const semCusto = Object.values(S.insumos).filter(i => i.ativo !== false && D.custoInsumo(S.st, i).v == null);
    if (semCusto.length) out.push({ c: 'p', t: `<b>${semCusto.length} insumo(s) sem custo</b>: registre uma compra ou informe o custo de referência para o custo dos produtos ficar completo.`, a: 'ir', v: 'estoque' });
  }
  const meta = cfg('geral').metaDiaria;
  if (U.ok(meta) && pode('financeiro')) {
    const f = D.resumoVendas(S.st, U.periodo('hoje')).fat;
    if (f >= meta) out.push({ c: 'p', t: `Meta diária atingida: ${brl(f)} vendidos hoje (meta ${brl(meta)}).` });
  }
  S.st.avisos.slice(-5).forEach(a => out.push({ c: 'o', t: h(a) }));
  return out;
}

function renderTela() {
  const v = document.getElementById('view');
  if (!v) return;
  // preserva foco e cursor de campos da própria tela (ex.: busca) durante a atualização ao vivo
  const at = document.activeElement;
  const foco = at && v.contains(at) && at.id ? { id: at.id, s: at.selectionStart, e: at.selectionEnd } : null;
  if (S.cfg.geral == null && S.carregado.geral) { v.innerHTML = TelaSemConfig(); return; }
  try { v.innerHTML = (V[UI.tela] || V.inicio)(); }
  catch (e) { console.error(e); v.innerHTML = `<div class="alerta r">${I('alerta')}<span>Erro ao montar a tela: ${h(e.message)}</span></div>`; }
  if (foco) { const el = document.getElementById(foco.id); if (el) { el.focus(); try { el.setSelectionRange(foco.s, foco.e); } catch (e) { } } }
}

function TelaSemConfig() {
  if (!pode('config')) return Vazio('O sistema ainda não foi configurado. Aguarde a proprietária concluir a configuração inicial.');
  return `<div class="card"><h2>Configuração inicial</h2><p class="muted" style="margin:8px 0 14px">Não encontrei a configuração do sistema no banco. Crie a estrutura padrão (contas, categorias, formas de pagamento sem taxas e DAS sem valor). Nenhuma venda, despesa ou valor fictício é criado.</p><button class="btn" data-a="criarPadrao">Criar configuração padrão</button></div>`;
}

let renderPendente = false;
function agendarRender(tipo) {
  if (tipo === 'modo') return render();
  if (renderPendente) return;
  renderPendente = true;
  requestAnimationFrame(() => {
    renderPendente = false;
    if (S.modo !== 'app') return render();
    if (!document.getElementById('view')) return render();
    atualizarCasca();
    // não apaga um formulário da tela que a pessoa está preenchendo; ele é atualizado depois de salvar
    if (document.querySelector('#view form[data-sujo]')) return;
    renderTela();
    if (Folha.aberta('nv')) nvAtualizarSeguro();
  });
}

/* =====================================================================

function deltaFat(p) { const a = U.anterior(p); return [D.resumoVendas(S.st, p), D.resumoVendas(S.st, a), a]; }

V.inicio = () => {
  if (!pode('financeiro')) return inicioAtendente();
  const p = per('inicio'), ant = U.anterior(p), cf = cfg('financeiro');
  const d = D.dre(S.st, p, cf), da = D.dre(S.st, ant, cf);
  const v = d.v;
  const tri = ['hoje', 'semana', 'mes'].map(k => { const q = U.periodo(k); const r = D.resumoVendas(S.st, q); return [k === 'hoje' ? 'Hoje' : k === 'semana' ? 'Semana' : 'Mês', r]; });
  const cx = D.caixa(S.st, cf, p);
  const rec = D.receber(S.st);
  const recV = rec.reduce((a, t) => a + (t.valor || 0), 0);
  const dd = (a, b) => U.variacao(a, b);
  const fator = cfg('geral').fatorProximo || 1.5;
  const est = D.estoqueLista(S.st, S.insumos, fator);
  const cont = k => est.filter(i => i.sit.k === k).length;
  const top = Object.values(v.porProd).sort((a, b) => b.receita - a.receita).slice(0, 5);
  const mx = top.length ? top[0].receita : 1;
  // evolução: por hora quando o período é um dia; senão por dia
  let graf;
  if (p.ini === p.fim) {
    const hs = Object.keys(v.porHora).map(Number);
    const h0 = hs.length ? Math.min(...hs, 12) : 12, h1 = hs.length ? Math.max(...hs, 18) : 18;
    const horas = []; for (let x = h0; x <= h1; x++) horas.push(x);
    graf = Barras(horas.map(x => x + 'h'), horas.map(x => v.porHora[x] || 0), { fmt: x => brl(x), titulo: 'Faturamento por hora' });
  } else {
    const ds = U.dias(p.ini, p.fim);
    graf = Barras(ds.map(x => ds.length <= 7 ? U.DSEM[U.dow(x)] + ' ' + x.slice(8) : U.dcurta(x)), ds.map(x => v.porDia[x] || 0), { fmt: x => brl(x), titulo: 'Faturamento por dia' });
  }
  const al = alertas().filter(a => a.c !== 'p' || /SumUp|saldo inicial|ficha/.test(a.t)).slice(0, 4);
  return `
  <div class="grid g3 tri">${tri.map(([l, r]) => `<div class="card" style="padding:12px">${Kpi({ label: l, valor: brl(r.fat), sub: r.n + ' venda' + (r.n === 1 ? '' : 's') })}</div>`).join('')}</div>
  ${ChipsPer('inicio')}
  <div class="grid gA">
    <div class="card destaque"><div class="grid hero">${Kpi({ label: 'Faturamento', valor: brl(v.fat), delta: dd(v.fat, da.v.fat), grande: true })}${Kpi({ label: 'Vendas', valor: v.n, delta: dd(v.n, da.v.n) })}${Kpi({ label: 'Ticket médio', valor: brl(v.ticket), delta: dd(v.ticket, da.v.ticket) })}</div><small style="display:block;margin-top:8px">Comparado com ${h(ant.label)}${v.canc ? ` · ${v.canc} cancelada(s): ${brl(v.cancV)}` : ''}</small></div>
